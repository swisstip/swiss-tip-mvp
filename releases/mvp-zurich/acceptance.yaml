- case_id: UAT-76
  label: Sometimes a charge, sometimes not
  spec: docs/product/user-acceptance-tests.md#uat-76-sometimes-a-charge-sometimes-not
  question: I order small things from a platform abroad. Sometimes there is a charge and sometimes
    there is not. Why?
  expected_answer: Two different reasons, which the answer must keep apart. Tax amounts of up to
    five francs are not levied for reasons of administrative economy, which corresponds to a
    taxable base of 62 francs at the 8.1 per cent rate or 193 francs at the 2.6 per cent rate; and
    a mail-order company or platform operator entered in the Swiss value-added tax register owes
    the domestic tax on its deliveries from abroad, so the tax is charged at the sale.
  trap: Stating a single price limit under which everything arrives free of charge, or presenting
    the five-franc threshold as a limit on the value of the goods.
