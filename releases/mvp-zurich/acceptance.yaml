- case_id: UAT-33
  label: 'Medical emergency: the number and who pays the ambulance'
  spec: docs/product/user-acceptance-tests.md#uat-33-medical-emergency-and-the-ambulance-costs
  question: My flatmate collapsed in our flat in Zurich. What number do I call, and who pays for the ambulance?
  expected_answer: Call 144 at once, even when unsure; be ready to say where exactly, the call-back number and what
    happened. For an illness basic insurance pays part of the rescue costs (all of them depending on the policy),
    for an accident the accident insurance pays; by law the invoice goes to the patient. The Schutz & Rettung page
    is cited.
  trap: The ambulance is free, or basic insurance pays it all; 112 given as the only number.
