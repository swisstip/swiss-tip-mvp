- case_id: UAT-52
  label: The tax at source in Winterthur compared with the City of Zurich
  spec: docs/product/user-acceptance-tests.md#uat-52-the-tax-at-source-in-winterthur-compared-with-the-city-of-zurich
  question: I live in Winterthur, have a B permit and am taxed at source. How much tax at source do I pay, and would
    it be less if I lived in the city of Zurich?
  expected_answer: 'The release serves no amount: the deduction depends on the tariff code (civil status, number
    of children, church tax Y or N) and the gross monthly salary, and the Canton of Zurich''s tariff tables apply
    to the whole canton. The 2026 tariffs are calculated with the cantonal tax multiplier of 98 per cent and the
    weighted average of the municipal tax multipliers (109.90 per cent without church tax, 116.00 per cent with),
    so moving to the City of Zurich does not change the tax at source. The Cantonal Tax Office''s tariff calculator
    determines the code (not legally binding) and its tariff page publishes the tables. The tariff page and the
    2026 calculation parameters are cited.'
  trap: A percentage of salary quoted from memory, or Winterthur's own municipal tax multiplier said to change the
    deduction, or the ordinary tax rates of the two municipalities compared.
  steps:
  - search:
      query: tax at source rate Winterthur compared to city of Zurich
      expect_concept: zh-tax-at-source-tariffs
      expect_strength: strong
  - resolve:
      concept_ids:
      - zh-tax-at-source-tariffs
      - tax-at-source-tariff-codes
      jurisdiction:
        canton_code: CH-ZH
        municipality_id: CH-ZH-230
      expect_status:
        zh-tax-at-source-tariffs: SUPPORTED
        tax-at-source-tariff-codes: SUPPORTED
  claims:
  - claim: The tariffs use the weighted average of the municipal tax multipliers
    concept: zh-tax-at-source-tariffs
    fact_id: zh-tax-at-source-tariffs-9
    statement_contains:
    - weighted average of the municipal tax multipliers
    - same in every municipality
    excerpt_contains:
    - Gewogenes Mittel der
  - claim: The tariff code is a letter, the number of children and church tax Y or N
    concept: zh-tax-at-source-tariffs
    fact_id: zh-tax-at-source-tariffs-1
    statement_contains:
    - a letter, a number and Y or N
    excerpt_contains:
    - Kirchensteuer Ja oder Nein
  - claim: The tariff calculator is not legally binding
    concept: zh-tax-at-source-tariffs
    fact_id: zh-tax-at-source-tariffs-7
    statement_contains:
    - not legally binding
    excerpt_contains:
    - nicht rechtsverbindlich
  not_served:
    zh-tax-at-source-tariffs:
    - amount of tax at source for a given salary
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    - A10
    must_mention:
      same_everywhere: same|no difference|not change|weighted average|gewogen
      tariff_code: tariff|Tarif
    cites:
