      jurisdiction: {canton_code: CH-ZH}
      expect_status:
        customs-internet-orders: SUPPORTED
        customs-mail-order-vat: SUPPORTED
  claims:
  - claim: Tax amounts up to five francs are not levied
    concept: customs-internet-orders
    fact_id: customs-internet-orders-10
    statement_contains: ['five Swiss francs are not levied']
    excerpt_contains: ['Steuerbeträge bis 5 Schweizerfranken nicht erhoben']
  - claim: A registered mail-order company or platform owes the domestic tax on deliveries from abroad
    concept: customs-mail-order-vat
    fact_id: customs-mail-order-vat-3
    statement_contains: ['subject to the domestic tax']
    excerpt_contains: ['unterliegen nicht nur die Lieferungen innerhalb des Inlandes']
  answer:
