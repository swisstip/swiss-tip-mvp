        zh-premium-reduction: NEEDS_CONTEXT
  - resolve:
      concept_ids:
      - zh-premium-reduction
      jurisdiction:
        canton_code: CH-ZH
        municipality_id: CH-ZH-69
      context:
        arrival_from: abroad
      expect_status:
        zh-premium-reduction: SUPPORTED
