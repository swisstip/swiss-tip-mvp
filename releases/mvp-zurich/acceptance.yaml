- case_id: UAT-83
  label: Changing insurer after a rise
  spec: docs/product/user-acceptance-tests.md#uat-83-changing-insurer-after-a-rise
  question: My premium is going up again. Can I switch insurer, and by when?
  expected_answer: Both notice periods the act sets apart. The ordinary one is three months to the
    end of a calendar half-year. When the new premium is notified, a shorter one opens - one
    month's notice to the end of the month before the month from which the new premium applies,
    and the insurer must notify the approved premiums at least two months in advance. The new
    insurer may not refuse an applicant for basic insurance, the old cover runs until the new
    insurer has confirmed cover without interruption, and the old insurer may not make the change
    conditional on giving up a supplementary insurance.
