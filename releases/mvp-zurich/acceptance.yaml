  label: Two people, one coffee machine
  spec: docs/product/user-acceptance-tests.md#uat-72-two-people-one-coffee-machine
  question: My partner and I are driving to Konstanz on Saturday. If we buy a coffee machine
    together for 280 euros, are we under the limit because there are two of us?
  expected_answer: No. The value-free limit can be claimed only once per person and per day, and
    a single item worth more than CHF 150 is always subject to value-added tax whatever the number
    of people travelling, so the machine is declared and the tax falls due on it. The answer
    states the limit and says which of the two rules decides the case.
  trap: Adding two allowances together and concluding that a 280-euro item stays free.
