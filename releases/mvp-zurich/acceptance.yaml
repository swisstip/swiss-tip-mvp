  label: 'Another canton, in German: a Brazilian licence after ten months in St. Gallen'
  spec: docs/product/user-acceptance-tests.md#uat-37-a-foreign-licence-in-st-gallen-in-german
  question: Ich bin vor zehn Monaten aus Brasilien nach St. Gallen gezogen und fahre noch mit meinem brasilianischen
    Führerausweis. Wie lange darf ich das noch, und was muss ich für den Umtausch tun?
  language: de
  expected_answer: 'In German, from the federal facts: a resident may drive on a foreign licence for twelve months
    only, so two months remain; after twelve months of residence a Swiss licence is needed (VZV Article 42(3bis));
    the exchange stays possible later, but a fine may be charged; the exchange needs the original licence and an
    eye test, and a licence from a state outside the EU/EEA requires a control drive. The answer says that the release
    publishes no St. Gallen procedure, form, office or fee (exchange fees are named as not served) and carries over
    nothing from the Canton of Zurich''s pages. The ch.ch page (and the VZV where quoted) is cited. The search is
    sent in German.'
  trap: 'The Canton of Zurich''s procedure presented as St. Gallen''s: the Zurich Road Traffic Office''s locations
    (Albisgütli, Winterthur), its application form and country lists, or its control-drive rules quoted for a resident
    of St. Gallen; the foreign licence treated as valid without limit.'
  steps:
  - search:
      query: ausländischer Führerausweis umtauschen Frist St. Gallen
      expect_concept: foreign-licence-exchange
      expect_strength: strong
  - resolve:
      concept_ids:
      - foreign-licence-exchange
      - zh-foreign-licence-exchange
      - zh-control-drive
      - zh-road-traffic-office-locations
      jurisdiction:
        canton_code: CH-SG
      context:
        licence_state: other
      expect_status:
        foreign-licence-exchange: SUPPORTED
        zh-foreign-licence-exchange: OUT_OF_COVERAGE
        zh-control-drive: OUT_OF_COVERAGE
        zh-road-traffic-office-locations: OUT_OF_COVERAGE
      expect_gap:
        foreign-licence-exchange: more_specific_jurisdiction_not_published
        zh-foreign-licence-exchange: jurisdiction_not_covered
        zh-control-drive: jurisdiction_not_covered
        zh-road-traffic-office-locations: jurisdiction_not_covered
      expect_basis:
        foreign-licence-exchange: 'Federal ordinance: VZV, SR 741.51, Art. 42'
  claims:
  - claim: A Swiss licence is needed after twelve months of residence
    concept: foreign-licence-exchange
    fact_id: foreign-licence-exchange-1
    statement_contains:
    - lived in Switzerland for twelve months
    excerpt_contains:
    - die seit zwölf Monaten in der Schweiz wohnen
  - claim: Twelve months only on the foreign licence; a later exchange may cost a fine
    concept: foreign-licence-exchange
    fact_id: foreign-licence-exchange-3
    statement_contains:
    - for twelve months only
    - a fine may be charged
    excerpt_contains:
    - nur während zwölf Monaten mit einem ausländischen Führerausweis fahren
    - allerdings kann eine Busse anfallen
  - claim: The original licence and an eye test in every case
    concept: foreign-licence-exchange
    fact_id: foreign-licence-exchange-4
    statement_contains:
    - original licence must be presented and an eye test passed
    excerpt_contains:
    - Original-Führerausweis vorlegen und einen Sehtest bestehen
  - claim: A licence from outside the EU/EEA requires a control drive
    concept: foreign-licence-exchange
    fact_id: foreign-licence-exchange-5
    statement_contains:
