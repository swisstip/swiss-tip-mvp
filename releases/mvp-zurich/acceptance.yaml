    starting work (SEM), and AIG Article 12 names the authority at the place of residence; an open-ended contract
    leads to a residence permit B; permits are issued by the cantonal migration offices, and SEM''s directory names
    Aargau''s (Amt für Migration und Integration Kanton Aargau, Bahnhofstrasse 88, 5001 Aarau, +41 62 835 18 60).
    The answer asks for the arrival date instead of computing a deadline and says that the release publishes no
    Aargau or Baden procedure. The SEM free-movement FAQ and SEM''s directory are cited.'
  trap: 'Following the employer''s address: the Zurich Migration Office (Berninastrasse 45), the City of Zurich''s
    Personenmeldeamt with its appointment duty, or the Canton of Zurich''s registration page given to a resident
    of Aargau; computing a deadline without the arrival date.'
  steps:
  - search:
      query: register municipality residence permit EU citizen job in Zurich living in Aargau
      expect_concept: eu-employment-registration-deadline
      expect_strength: strong
  - resolve:
      concept_ids:
      - eu-employment-registration-deadline
      - aig-registration
      - permit-authority
      - cantonal-migration-contact
      - zh-eu-registration
      jurisdiction:
        canton_code: CH-AG
      context:
        population: eu_efta
      expect_status:
        eu-employment-registration-deadline: SUPPORTED
        aig-registration: SUPPORTED
        permit-authority: SUPPORTED
        cantonal-migration-contact: SUPPORTED
        zh-eu-registration: OUT_OF_COVERAGE
      expect_gap:
        eu-employment-registration-deadline: more_specific_jurisdiction_not_published
        aig-registration: more_specific_jurisdiction_not_published
        permit-authority: more_specific_jurisdiction_not_published
        zh-eu-registration: jurisdiction_not_covered
      expect_basis:
        aig-registration: 'Federal act: AIG, SR 142.20, Art. 12'
        cantonal-migration-contact: Federal authority directory
  - resolve:
      concept_ids:
      - city-zurich-arrival
      - zh-migrationsamt-contact
      jurisdiction:
        canton_code: CH-AG
      context:
        population: eu_efta
        arrival_origin: abroad
      expect_status:
        city-zurich-arrival: OUT_OF_COVERAGE
        zh-migrationsamt-contact: OUT_OF_COVERAGE
      expect_gap:
        city-zurich-arrival: jurisdiction_not_covered
        zh-migrationsamt-contact: jurisdiction_not_covered
  claims:
  - claim: Registration with the municipality of residence within 14 days and before starting work
    concept: eu-employment-registration-deadline
    fact_id: eu-employment-registration-deadline-1
    statement_contains:
    - municipality of residence
