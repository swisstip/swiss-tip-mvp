- case_id: UAT-90
  label: A bill from the doctor, not from the insurer
  spec: docs/product/user-acceptance-tests.md#uat-90-a-bill-from-the-doctor-not-from-the-insurer
  question: My doctor sent the bill to me and not to my health insurer. Is that allowed?
  expected_answer: That is the ordinary case. Unless the insurer and the provider have agreed
    otherwise, the insured person owes the provider the payment and then has a claim for
    reimbursement against the insurer, which is the tiers garant system; the other arrangement, in
    which the insurer owes the payment, exists by agreement and covers the insurer's share for
    inpatient treatment. The bill has to be detailed and comprehensible and to carry what is needed
    to check how the payment was calculated.
