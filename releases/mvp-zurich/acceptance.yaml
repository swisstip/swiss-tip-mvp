        municipality_id: CH-ZH-261
      expect_status:
        city-zurich-tax-return: SUPPORTED
  claims:
  - claim: The city's tax office cannot issue a new access code
    concept: city-zurich-tax-return
    fact_id: city-zurich-tax-return-3
    statement_contains:
    - not by the City of Zurich's tax office
    excerpt_contains:
    - Das Steueramt der Stadt Zürich kann Ihnen keinen neuen Zugangscode ausstellen
  - claim: The 2025 return was due by 31 March 2026
    concept: city-zurich-tax-return
    fact_id: city-zurich-tax-return-2
    statement_contains:
    - by 31 March 2026
    excerpt_contains:
    - bis zum 31. März 2026 einzureichen
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A8
    - A9
    must_mention:
      cantonal: '[Kk]antonal'
      deadline: 31\.? März
    cites:
      tax_return: natuerliche-personen/steuererklaerung
    resolved:
    - city-zurich-tax-return
