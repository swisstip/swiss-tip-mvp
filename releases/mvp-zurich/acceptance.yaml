  - claim: A single item over the limit is always taxed, whatever the number of travellers
    concept: customs-travel-allowance
    fact_id: customs-travel-allowance-6
    statement_contains: ['irrespective of how many people']
    excerpt_contains: ['unabhängig von der Anzahl Personen']
