- case_id: UAT-87
  label: Living in Germany, working in Zurich
  spec: docs/product/user-acceptance-tests.md#uat-87-living-in-germany-working-in-zurich
  question: I live in Konstanz and start work in Zurich next month. Which country's health
    insurance do I take?
  expected_answer: The place-of-work principle makes Swiss insurance the rule, for the worker and
    for their non-working family members. The agreements with the neighbouring states open a right
    of option to be insured in the country of residence instead, and an application for exemption
    has to be filed with the authority of the canton of work within three months of the start of
    the employment relationship. A merely tacit exercise of the option is not legally valid.
  trap: Answering "Switzerland, because you work there" without the option, or asserting that the
    choice is made once and for all.
