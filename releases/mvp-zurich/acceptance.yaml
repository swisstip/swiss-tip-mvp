  question: Ich wohne in der Stadt Zürich und habe den Zugangscode für die Online-Steuererklärung verloren. Kann
    mir das Steueramt der Stadt einen neuen ausstellen, und bis wann muss die Steuererklärung 2025 eingereicht sein?
  expected_answer: 'In German: no, the city''s tax office cannot issue a new access code; it is requested with the
    web form of the Cantonal Tax Office''s technical support. The 2025 return was due by 31 March 2026; an extension
    had to be asked before that date, and without a return a reminder follows (reminder deadlines cannot be extended).
    The City of Zurich tax-return page is cited.'
  trap: Sending the user to the city's tax office for the code; a deadline from general knowledge or another canton.
