  label: Where to turn after racist discrimination at work
  spec: docs/product/user-acceptance-tests.md#uat-69-where-to-turn-after-racist-discrimination
  question: My colleague keeps making remarks about my skin colour and my manager laughs along. Is that racist discrimination,
    and who advises me in Zurich?
  expected_answer: ZüRAS, the Zurich counselling centre against racism, advises people who experience racist discrimination;
    counselling is possible in several languages and free for people living in the Canton of Zurich, and it is run
    by the AOZ on behalf of canton and city. The canton counts demeaning statements as a form of racist discrimination
    and names the workplace as a place where it occurs. Beyond the canton there are the counselling network for
    victims of racism and the reporting platform for online hate speech. The legal bases are the Federal Constitution
    (Art. 8(2)), the Criminal Code (Art. 261bis, for acts in public) and AIG Art. 53. Whether this particular case
    is punishable is not something the service decides.
  trap: Answering with a general definition of racism and no address, or promising that the described behaviour
    is punishable under Article 261bis, which applies to acts committed in public.
  language: en
  steps:
  - search:
      query: advice racist discrimination Zurich
      expect_concept: zh-racism-protection
      expect_strength: strong
  - resolve:
      concept_ids:
      - zh-racism-protection
      jurisdiction: *id004
      expect_status:
        zh-racism-protection: SUPPORTED
