- case_id: UAT-70
  label: An association asks for money for an integration project
  spec: docs/product/user-acceptance-tests.md#uat-70-an-association-asks-for-project-money
  question: Our association in Uster wants to run a neighbourhood festival for Swiss and migrant families and needs
    about 4,000 francs. Can the Canton of Zurich contribute, and how do we apply?
  expected_answer: 'Yes in principle: municipalities and public or private non-profit organisations with their seat
    or a regional branch in the canton can apply, and a festival that brings migrants and the resident population
    together falls under the priority «living together and participation». At 4,000 francs it is a small project:
    up to 5,000 francs, submitted on a rolling basis while funds last, with simplified rules, a budget on the canton''s
    mandatory template, and a web form that cannot be saved in between. The contact for this area is named on the
    page. Whether the project is funded is the Fachstelle''s decision.'
  trap: Quoting the deadline of 31 October 2026 or the 50,000-franc maximum, which belong to projects above 5,000
    francs, or promising the money.
