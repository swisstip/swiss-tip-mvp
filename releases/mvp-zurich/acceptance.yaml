- case_id: UAT-45
  label: 'Short stay: how the 90 days in 180 are counted'
  spec: docs/product/user-acceptance-tests.md#uat-45-how-the-90-days-in-180-are-counted
  question: I am from a country whose citizens need no visa. I was in the Schengen area for 60 days between March
    and May and now want to spend another 50 days in Zurich. Is that allowed?
  expected_answer: 'No: a third-country national may spend at most 90 days within any 180 days in the Schengen area,
    the day of entry and the day of departure count, and the 180 days are a rolling window, so on the day of entry
    the last 180 days are counted back. With 60 days already used inside that window only 30 remain; after 90 days
    spent outside the area a new 90 days become available. The answer must not compute a date without the user''s
    exact dates, and cites SEM''s page on calculating the duration of stay.'
  trap: Treating the 90 days as a fresh allowance per entry, per country or per calendar half-year, or computing
    an exact date although the user gave no arrival date.
  steps:
  - search:
      query: how long can I stay in the Schengen area 90 days 180 days
      expect_concept: entry-short-stay-rule
      expect_strength: strong
  - resolve:
      concept_ids:
      - entry-short-stay-rule
      jurisdiction:
        canton_code: CH-ZH
      expect_status:
        entry-short-stay-rule: SUPPORTED
  claims:
  - claim: At most 90 days within 180 days
    concept: entry-short-stay-rule
    fact_id: entry-short-stay-rule-1
    statement_contains:
    - at most 90 days within 180 days
    excerpt_contains:
    - maximal für 90 Tage innerhalb von 180 Tagen
  - claim: The day of entry counts as the first day
    concept: entry-short-stay-rule
    fact_id: entry-short-stay-rule-1
    statement_contains:
    - The day of entry counts as the first day
    excerpt_contains:
    - Der Tag der Einreise zählt als erster Tag
  - claim: The 180 days are a rolling period
    concept: entry-short-stay-rule
    fact_id: entry-short-stay-rule-1
    statement_contains:
    - rolling period
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    must_mention:
      ninety: 90 days
      window: '180'
    must_not:
      per_entry: 90 days (?:per|for each) (?:entry|country|visit)
    cites:
      stay_rules: voraussetzungen-nach-staat/mit-visum/aufenthaltsrechner
    resolved:
    - entry-short-stay-rule
- case_id: UAT-46
  label: Which visa for a two-year job in Zurich, and who approves it
  spec: docs/product/user-acceptance-tests.md#uat-46-which-visa-for-a-two-year-job-in-zurich
  question: I am a third-country national with a job offer in Zurich for two years. Which visa do I need and who
    has to approve it?
  expected_answer: A national visa of type D, which is issued for stays of more than 90 days and is needed for gainful
    employment, not a Schengen visa C. It is granted only with the approval of the cantonal migration office of
    the intended place of residence, so the Swiss representation forwards the application to the Canton of Zurich;
    questions about the permit go to the cantonal authorities. SEM's FAQ and the FDFA visa page are cited.
  trap: A Schengen visa C for a two-year job, or a visa the representation grants on its own without the cantonal
    migration office.
  steps:
  - search:
      query: which visa do I need to work in Switzerland for two years
