    excerpt_contains:
    - bei ihrer Wohngemeinde anmelden
    - vor Stellenantritt
  - claim: An open-ended contract leads to a residence permit B
    concept: eu-employment-registration-deadline
    fact_id: eu-employment-registration-deadline-1
    statement_contains:
    - residence permit B
    excerpt_contains:
    - Vertragsdauer von mindestens einem Jahr oder unbefristet
  - claim: AIG Article 12 names the authority at the place of residence
    concept: aig-registration
    fact_id: aig-registration-1
    statement_contains:
    - register with the authority at their Swiss residence
    excerpt_contains:
    - bei der am Wohnort in der Schweiz zuständigen Behörde anmelden
  - claim: Permits are issued by the cantonal migration offices
    concept: permit-authority
    statement_contains:
    - issued by the cantonal migration offices
    excerpt_contains:
    - Residence permits are issued by the Cantonal Migration Offices
  - claim: SEM's directory names the Aargau migration office
    concept: cantonal-migration-contact
