    concept: health-insurance-billing
    fact_id: health-insurance-billing-1
    statement_contains: ['tiers garant']
    excerpt_contains: ['System des Tiers garant']
  - claim: By agreement the insurer owes the payment instead
    concept: health-insurance-billing
    fact_id: health-insurance-billing-2
    statement_contains: ['tiers payant']
    excerpt_contains: ['System des Tiers payant']
