        municipality_id: CH-ZH-261
      expect_status:
        city-zurich-medical-emergency: SUPPORTED
  claims:
  - claim: Call 144 at once
    concept: city-zurich-medical-emergency
    fact_id: city-zurich-medical-emergency-1
    statement_contains:
    - emergency number 144
    excerpt_contains:
    - Rufen Sie im Notfall sofort die Notrufnummer 144 an
  - claim: Basic insurance pays part; the invoice goes to the patient
    concept: city-zurich-medical-emergency
    fact_id: city-zurich-medical-emergency-3
    statement_contains:
    - basic health insurance pays part of the rescue costs
    - always addressed to the patient
    excerpt_contains:
    - Die Grundversicherung übernimmt einen Teil
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    must_mention:
      number: '144'
      patient_invoice: invoice|bill
    must_not:
      free_ambulance: ambulance is free
    cites:
      emergency: notfall/notfaelle/medizinischer-notfall
    resolved:
    - city-zurich-medical-emergency
