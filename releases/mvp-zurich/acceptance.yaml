pack: mvp-zurich
cases:
- case_id: UAT-1
  label: 'Czech citizen: EU/EFTA registration deadline in Zurich'
  spec: docs/product/user-acceptance-tests.md#uat-1-czech-citizen-registering-in-zurich
  question: I'm a Czech citizen and starting my work in Zurich next week. By when latest should I register my stay
    on the municipal authority?
  expected_answer: Both limits, within 14 days of arrival and before starting work, and that the earlier one binds.
    The assistant asks for the arrival date and the first working day instead of computing a date, and cites the
    SEM free-movement FAQ and the Zurich pages.
  trap: Counting 14 days from the first working day; computing a date before knowing the arrival.
  steps:
  - search:
      query: register stay municipal authority Zurich
      expect_concept: zh-eu-registration
      expect_strength: strong
  - resolve:
      concept_ids:
      - eu-employment-registration-deadline
      - zh-eu-registration
      jurisdiction:
        canton_code: CH-ZH
      context:
        population: eu_efta
      expect_status:
        eu-employment-registration-deadline: SUPPORTED
        zh-eu-registration: SUPPORTED
      expect_basis:
        eu-employment-registration-deadline: Federal authority guidance
        zh-eu-registration: Cantonal authority guidance
  - resolve:
      concept_ids:
      - city-zurich-arrival
      jurisdiction:
        canton_code: CH-ZH
        municipality_id: CH-ZH-261
      context:
        population: eu_efta
        arrival_origin: abroad
      expect_status:
        city-zurich-arrival: SUPPORTED
      expect_basis:
        city-zurich-arrival: Municipal authority guidance
  claims:
  - claim: Registration is due within 14 days of arrival
    concept: eu-employment-registration-deadline
    statement_contains:
    - within 14 days
    excerpt_contains:
    - Innert 14 Tagen nach ihrer Ankunft
  - claim: Registration must be completed before starting work
    concept: eu-employment-registration-deadline
    statement_contains:
    - before starting work
    excerpt_contains:
    - vor Stellenantritt
  - claim: The City of Zurich requires an appointment for arrivals from abroad
    concept: city-zurich-arrival
    statement_contains:
    - appointment
    excerpt_contains:
    - müssen Sie einen Termin vereinbaren
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    must_mention:
      fourteen_days: \b14\b
      before_work: before (you |your |the )?(actually )?(start|taking up|commenc|first working day)
    cites:
      sem_faq: eu-efta_buerger_schweiz/faq
    resolved:
    - eu-employment-registration-deadline
- case_id: UAT-2e
  label: 'Third-country national asking in German: the untranslated search and the third-country admission'
  spec: docs/product/user-acceptance-tests.md#uat-2e-third-country-national-asking-about-a-work-permit-in-german
  question: Ich habe die indische Staatsbürgerschaft. Darf ich in der Schweiz arbeiten? Welche Voraussetzungen gelten
    für eine Arbeitsbewilligung und eine Aufenthaltsbewilligung?
  expected_answer: 'In German, from the served facts: admission is limited to well-qualified persons (managers,
    specialists, graduates with experience); the employer proves that nobody suitable is available in Switzerland
    or the EU/EFTA and applies for the permit, which is required before work regardless of duration; the cantonal
    migration office issues it; a B permit for stays over a year. No EU/EFTA rule, no quotas, procedures or fees;
    the SEM third-country page and Fedlex are cited. The search is sent in German and finds the third-country concept
    through its German aliases without a translation into English first.'
  trap: Mixing in EU/EFTA rules; inventing quotas and procedures; translating the question into English before searching,
    and answering in English, although the release carries German aliases.
  steps:
  - search:
      query: Arbeitsbewilligung Aufenthaltsbewilligung Indien Staatsangehörige
      expect_concept: third-country-work
      expect_strength: strong
  - resolve:
      concept_ids:
      - third-country-work
      - aig-work-permit
      - permit-authority
      - permit-b
      - permit-l
      context:
        population: third_country
      expect_status:
        third-country-work: SUPPORTED
        aig-work-permit: SUPPORTED
        permit-authority: SUPPORTED
        permit-b: SUPPORTED
        permit-l: SUPPORTED
      expect_basis:
        third-country-work: Federal authority guidance
        aig-work-permit: 'Federal act: AIG, SR 142.20, Art. 11'
        permit-b: 'Federal act: AIG, SR 142.20, Art. 33'
  claims:
  - claim: Admission is limited to well-qualified persons
    concept: third-country-work
    statement_contains:
    - well-qualified
    excerpt_contains:
    - wenn Sie gut qualifiziert sind
  - claim: The employer must show that no suitable person is available in Switzerland or the EU/EFTA
    concept: third-country-work
    statement_contains:
    - employer
    - no suitable person
    excerpt_contains:
    - Ihr zukünftiger Arbeitgeber hat nachzuweisen
  - claim: A permit is needed for work whatever the duration of the stay
    concept: aig-work-permit
    statement_contains:
    - irrespective of the duration of stay
    excerpt_contains:
    - unabhängig von der Aufenthaltsdauer eine Bewilligung
  - claim: For employment the employer applies for the permit
    concept: aig-work-permit
    statement_contains:
    - assigns the permit application to the employer
    excerpt_contains:
    - von der Arbeitgeberin oder vom Arbeitgeber zu beantragen
  - claim: The cantonal migration office issues the permit
    concept: permit-authority
    statement_contains:
    - cantonal migration offices
    excerpt_contains:
    - issued by the Cantonal Migration Offices
  - claim: A B permit is for stays of more than one year
    concept: permit-b
    statement_contains:
    - longer than one year
    excerpt_contains:
    - mehr als einem Jahr
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A8
    must_mention:
      employer: Arbeitgeber
      qualification: qualifizier|Fachkr|Spezialist|Führungskr|Hochschul
    must_not:
      eu_efta_deadline_rule: (?:EU|EFTA)[^\n]{0,80}14\s*(?:Tage|Täg|days?)|14\s*(?:Tage|Täg|days?)[^\n]{0,80}(?:EU|EFTA)
      quotas_from_memory: Kontingent|Höchstzahl|Quote\b|quota
    cites:
      sem_work_page: nicht-eu_efta-angehoerige
    resolved:
    - third-country-work
- case_id: UAT-3
  label: family reunification for a child over twelve
  spec: docs/product/user-acceptance-tests.md#uat-3-family-reunification-for-a-child-over-twelve
  question: I have had a Swiss B permit since March 2022 and work in Zurich. My son is 13 and still lives with my
    mother in Pristina. Can I bring him to live with me now?
  expected_answer: The twelve-month deadline for children over twelve ran from the grant of the permit, so a reunification
    claimed now is late and is approved only for important family reasons, which the release does not assess. The
    Art. 44 conditions are stated as conditions, not as a promise of approval. The Fedlex AIG page is cited; no
    plain yes.
  trap: A plain yes with the usual conditions (housing, income); the twelve-month deadline for children over twelve
    is missed.
  steps:
  - resolve:
      concept_ids:
      - family-b
      - family-deadlines
      jurisdiction:
        canton_code: CH-ZH
      context:
        sponsor_status: b
      expect_status:
        family-b: SUPPORTED
        family-deadlines: SUPPORTED
      expect_basis:
        family-b: 'Federal act: AIG, SR 142.20, Art. 44'
        family-deadlines: 'Federal act: AIG, SR 142.20, Art. 47'
  claims:
  - claim: Children over twelve must be brought within twelve months
    concept: family-deadlines
    statement_contains:
    - twelve months
    excerpt_contains:
    - Kinder über zwölf Jahre müssen innerhalb von zwölf Monaten nachgezogen werden
  - claim: Art. 44 permits rather than guarantees a permit
    concept: family-b
    statement_contains:
    - rather than itself guarantees
    excerpt_contains:
    - kann eine Aufenthaltsbewilligung erteilt und verlängert werden
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    must_mention:
      twelve_month_deadline: (12|twelve)[ -]month|within (12|twelve) months
      late_reunification_needs_important_reasons: important (family )?reasons|late
    must_not:
      plain_yes_without_deadline: ^\s*(yes|ja)\b[^.]*\.\s*$
    cites:
      fedlex: fedlex
    resolved:
    - family-deadlines
- case_id: UAT-4
  label: permit after a marriage ends before three years
  spec: docs/product/user-acceptance-tests.md#uat-4-permit-after-a-marriage-ends-before-three-years
  question: I am a Brazilian citizen, married to a Swiss woman for two years, and living in Zurich on a B permit.
    We are separating. Will I lose my permit because we were not married for three years?
  expected_answer: 'Both alternatives of Art. 50: a union of at least three years with integration, or important
    personal reasons, which do not depend on the length of the marriage. Loss of the permit is not predicted as
    certain; the release does not assess individual reasons and the cantonal authority decides. The Fedlex AIG page
    is cited.'
  trap: Three years of marriage treated as the only route; loss of the permit predicted as certain.
  steps:
  - resolve:
      concept_ids:
      - family-separation
      jurisdiction:
        canton_code: CH-ZH
        municipality_id: CH-ZH-261
      expect_status:
        family-separation: SUPPORTED
  claims:
  - claim: The first route needs a union of at least three years
    concept: family-separation
    statement_contains:
    - at least three years
    excerpt_contains:
    - mindestens drei Jahre bestanden hat
  - claim: The second route rests on important personal reasons
    concept: family-separation
    statement_contains:
    - important personal reasons
    excerpt_contains:
    - wichtige persönliche Gründe einen weiteren Aufenthalt in der Schweiz erforderlich machen
  - claim: The two routes are alternatives, not one three-year rule
    concept: family-separation
    statement_contains:
    - must not be collapsed into a universal three-year requirement
    excerpt_contains:
    - erfüllt sind; oder b. wichtige persönliche Gründe
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    must_mention:
      three_year_alternative: three[ -]years?|3 years
      personal_reasons_alternative: important personal reasons|personal reasons
    must_not:
      states_certain_loss: you will lose|you lose your permit|automatically (?:lose|revoked)|will be revoked
    cites:
      fedlex: fedlex
    resolved:
    - family-separation
- case_id: UAT-5
  label: settlement permit after years on a short-stay permit
  spec: docs/product/user-acceptance-tests.md#uat-5-settlement-permit-after-years-on-a-short-stay-permit
  question: 'I am an Indian citizen. I have lived in Switzerland for ten years: three years on an L permit and then
    seven years on a B permit. Can I apply for a C permit now?'
  expected_answer: 'The Art. 34(2) conditions: ten years on L or B permits, the last five continuously on B, integration,
    no revocation grounds; temporary stays do not count toward the continuous five years. The five-year routes the
    release serves rest on settlement agreements, and SEM''s list of those states does not include India, so the
    ten-year rule applies to the user. Applied to the user, the ten-year total and the five continuous years on
    B are met; integration and revocation grounds remain for the authority. The Fedlex AIG page and the SEM page
    are cited.'
  trap: Counting ten years of presence and saying yes; quoting a five-year rule for a nationality the served list
    does not name.
  steps:
  - resolve:
      concept_ids:
      - permit-c
      - permit-c-five-years
      context:
        population: third_country
      expect_status:
        permit-c: SUPPORTED
        permit-c-five-years: SUPPORTED
  claims:
  - claim: Ten years on L or B permits are required
    concept: permit-c
    statement_contains:
    - at least ten years
    excerpt_contains:
    - insgesamt mindestens zehn Jahre mit einer Kurzaufenthalts- oder Aufenthaltsbewilligung
  - claim: The last five years must be continuous on a B permit
    concept: permit-c
    statement_contains:
    - last five years continuously
    excerpt_contains:
    - während den letzten fünf Jahren ununterbrochen im Besitz einer Aufenthaltsbewilligung
  - claim: Shorter routes exist, so ten years is not a universal waiting period
    concept: permit-c
    statement_contains:
    - not a universal waiting period
    excerpt_contains:
    - kann nach einem kürzeren Aufenthalt erteilt werden
  - claim: The five-year route rests on settlement agreements and names its states
    concept: permit-c-five-years
    fact_id: permit-c-five-years-3
    statement_contains:
    - after a lawful and uninterrupted stay of five years
    excerpt_contains:
    - ordnungsgemässen und ununterbrochenen Aufenthalt von fünf Jahren
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    must_mention:
      last_five_years_continuous: (last )?five years|5 years|fünf
      integration_and_revocation_conditions: integration
    must_not:
      five_year_rule_applied_to_the_user: you (can|could|may|will|would)[^.]{0,80}(5|five) years
    cites:
      fedlex: fedlex
    resolved:
    - permit-c
    - permit-c-five-years
- case_id: UAT-6
  label: social assistance and the permit
  spec: docs/product/user-acceptance-tests.md#uat-6-social-assistance-and-the-permit
  question: I have a B permit and just lost my job in Zurich. I may have to apply for social assistance for a few
    months. Will my permit be revoked?
  expected_answer: 'Revocation is not automatic: receipt of social assistance can have immigration consequences,
    but the cantonal migration authority decides individually and proportionately, and the release does not decide
    the user''s case. The SEM FAQ page is cited; no thresholds or durations are invented.'
  trap: Automatic revocation or non-renewal asserted.
  steps:
  - resolve:
      concept_ids:
      - social-assistance-review
      - permit-b
      jurisdiction:
        canton_code: CH-ZH
      expect_status:
        social-assistance-review: SUPPORTED
        permit-b: SUPPORTED
  claims:
  - claim: Social assistance does not cause consequences automatically
    concept: social-assistance-review
    statement_contains:
    - does not cause them automatically
    excerpt_contains:
    - führt jedoch nicht automatisch zu ausländerrechtlichen Konsequenzen
  - claim: The authority decides individually and proportionately
    concept: social-assistance-review
    statement_contains:
    - individually and proportionately
    excerpt_contains:
    - entscheidet im Einzelfall und im Rahmen der Verhältnismässigkeit
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    must_mention:
      not_automatic: not automatic|does not automatically|no automatic|not necessarily
      individual_or_proportionate_decision: individual|proportionat|case[- ]by[- ]case
    must_not:
      states_automatic_revocation: will be revoked|automatically revoked|you will lose
    cites:
      sem_faq: themen/aufenthalt/faq.html
    resolved:
    - social-assistance-review
- case_id: UAT-7
  label: Swiss citizen asking in Zurich German about a residence permit for a foreign spouse
  spec: docs/product/user-acceptance-tests.md#uat-7-swiss-citizen-asking-in-zurich-german-about-a-residence-permit-for-a-foreign-spouse
  question: Ich han de Schwiizer Pass und han en Brasilianer ghüratet. Er wohnt no in São Paulo und sött jetzt zu
    mir nach Züri zügle. Was bruuchts, dass er en Ufenthaltsbewilligung überchunnt, und bis wänn müend mir de Familienachzug
    aamälde?
  expected_answer: 'In the question''s language (dialect or Standard German): under Art. 42(1) the spouse of a Swiss
    citizen is entitled to a residence permit if the couple live together; the five-year reunification deadline
    runs from the entry or the marriage, and a late claim is approved only for important family reasons; the cantonal
    migration office issues the permit. No Art. 44 conditions for a Swiss sponsor, no documents, fees or processing
    times from memory. The caller searches in German rather than translating into English first.'
  trap: Applying the Art. 44 conditions (housing, income, language) to a Swiss sponsor; translating the dialect
    into English before searching.
  steps:
  - search:
      query: Brasilianer Ehefrau Ufenthaltsbewilligung Schweiz Familiennachzug Anforderungen
      expect_concept: family-swiss
      expect_strength: strong
  - resolve:
      concept_ids:
      - family-swiss
      - family-deadlines
      context:
        sponsor_status: swiss
      expect_status:
        family-swiss: SUPPORTED
        family-deadlines: SUPPORTED
      expect_basis:
        family-swiss: 'Federal act: AIG, SR 142.20, Art. 42'
  claims:
  - claim: The spouse of a Swiss citizen is entitled to a residence permit
    concept: family-swiss
    statement_contains:
    - entitled to a residence permit
    excerpt_contains:
    - haben Anspruch auf Erteilung und Verlängerung der Aufenthaltsbewilligung
  - claim: The entitlement depends on living together
    concept: family-swiss
    statement_contains:
    - if they live with
    excerpt_contains:
    - wenn sie mit diesen zusammenwohnen
  - claim: Reunification must be claimed within five years
    concept: family-deadlines
    statement_contains:
    - five-year deadline
    excerpt_contains:
    - innerhalb von fünf Jahren geltend gemacht werden
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A8
    must_mention:
      entitlement: Anspruch|Anrecht|Recht (?:uf|auf)|berechtigt
      five_year_deadline: (?:5|fünf|föif|füf|füüf)\s*(?:-|\s)?\s*(?:Jahr|Johr|Jaar)
      living_together: zusammen|zäme|zämme|gemeinsam|Haushalt
    must_not:
      art44_conditions_for_swiss_sponsor: Sozialhilf|Sprachkenntnis|Sprachnachweis|Sprachkurs|Ergänzungsleistung|bedarfsgerecht
      fees_or_processing_time: Gebühr|CHF|Franke|Bearbeitungszeit|Bearbeitigszit
    cites:
      fedlex: fedlex
    resolved:
    - family-swiss
- case_id: UAT-8
  label: 'German citizen leaving Switzerland: no AHV refund for EU/EFTA nationals'
  spec: docs/product/user-acceptance-tests.md#uat-8-refund-of-ahv-contributions-on-leaving-switzerland
  question: I'm a German citizen and after six years of working in Zurich I am moving back to Berlin for good. Can
    I get my AHV contributions paid back?
  expected_answer: 'With agreement_status eu_efta derived from "German citizen": no refund is published for EU/EFTA
    nationals; the groups for which one is (nationals of states without a social security agreement and of the named
    agreement states) are named; the general conditions (at least one year of contributions, definitive departure
    of the family) are stated as conditions of the refund, not as applying to the user; the release computes no
    pension and no amount. The ZAS page is cited; the refund procedure is not described as open to the user and
    the pension fund is not mixed in. Variations replayed: an Indian citizen (agreement, the conditional refund
    and the choice rule of the named states) and a missing nationality (NEEDS_CONTEXT).'
  trap: Saying yes and describing the refund form, or confusing the AHV with the pension fund; EU/EFTA nationals
    are excluded by name.
  steps:
  - search:
      query: AHV contributions paid back leaving Switzerland
      expect_concept: ahv-contribution-refund
      expect_strength: strong
  - resolve:
      concept_ids:
      - ahv-contribution-refund
      - ahv-pension-abroad
      context:
        agreement_status: eu_efta
      expect_status:
        ahv-contribution-refund: SUPPORTED
        ahv-pension-abroad: SUPPORTED
  - resolve:
      concept_ids:
      - ahv-contribution-refund
      context:
        agreement_status: agreement
      expect_status:
        ahv-contribution-refund: SUPPORTED
  - resolve:
      concept_ids:
      - ahv-contribution-refund
      expect_status:
        ahv-contribution-refund: NEEDS_CONTEXT
  claims:
  - claim: EU/EFTA nationals have no entitlement to a refund
    concept: ahv-contribution-refund
    statement_contains:
    - EU/EFTA state have no entitlement
    excerpt_contains:
    - Nein, wenn Sie die Staatsangehörigkeit eines der folgenden Länder besitzen
    - eines Landes der EU/EFTA
  - claim: The groups for which a refund is published are named to the EU/EFTA caller
    concept: ahv-contribution-refund
    statement_contains:
    - without a social security agreement
    - India
    excerpt_contains:
    - mit dem die Schweiz kein Sozialversicherungsabkommen abgeschlossen hat
  - claim: A refund needs at least one year of contributions
    concept: ahv-contribution-refund
    statement_contains:
    - at least one year
    excerpt_contains:
    - Sie müssen mindestens ein Jahr Beiträge gezahlt haben
  - claim: The person, the spouse and children under 25 must leave for good
    concept: ahv-contribution-refund
    statement_contains:
    - spouse and children under 25
    - for good
    excerpt_contains:
    - die feste Absicht haben, sie endgültig zu verlassen
  - claim: '8a: nationals of the named agreement states, India among them, can have a refund under conditions'
    concept: ahv-contribution-refund
    fact_id: ahv-contribution-refund-2
    statement_contains:
    - under certain conditions
    - India
    excerpt_contains:
    - (unter bestimmten Bedingungen)
  - claim: '8b: nationals of Brazil and four other states choose between a pension and a refund'
    concept: ahv-contribution-refund
    statement_contains:
    - choice between the payment of a pension and the refund
    excerpt_contains:
    - haben die Wahl zwischen der Auszahlung einer Rente und der Rückerstattung ihrer Beiträge
  - claim: '8e: EU/EFTA nationals keep their AHV pension abroad'
    concept: ahv-pension-abroad
    statement_contains:
    - keep their AHV pension
    excerpt_contains:
    - Sie haben weiterhin Anspruch auf Ihre Rente
  not_served:
    ahv-contribution-refund:
    - the amount of a refund
  must_not_serve:
  - ahv-contribution-refund-1
  - ahv-contribution-refund-9
  - ahv-contribution-refund-10
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    must_mention:
      eu_efta_named: EU|EFTA
      no_refund: no refund|not entitled|no entitlement|not eligible|cannot (?:get|claim|have)|no right
      one_year_condition: (?:one|1) (?:full )?year
    must_not:
      refund_procedure_as_open: fill (?:in|out) the (?:refund )?(?:application )?form|send (?:the|your) (?:refund
        )?application to
      pension_fund_mixed_in: pension fund|Pensionskasse|second pillar
    cites:
      zas_refund: zas.admin.ch/de/rueckverguetungen
    resolved:
    - ahv-contribution-refund
- case_id: UAT-9
  label: 'Moving to Munich: the mandatory pension fund part stays in Switzerland'
  spec: docs/product/user-acceptance-tests.md#uat-9-pension-fund-cash-out-when-moving-to-an-eu-state
  question: I'm moving from Zurich to Munich for good next month and start a job there. Can I have my whole pension
    fund paid out in cash?
  expected_answer: 'With destination eu_efta: the whole amount is not paid out; since 1 June 2007 the mandatory
    part is not paid in cash while the user remains insured in Germany against old age, death and disability, the
    extra-mandatory part can be paid out, a married user needs the spouse''s written consent, and the vested benefit
    is kept in a permitted form (the served FZG Article 4 statement). The BSV FAQ page is cited; no tax consequence
    and no amount. Variation replayed: moving to Brazil (destination other, cash payment on proof of definitive
    departure without the EU/EFTA restriction).'
  trap: Saying yes because leaving Switzerland permanently allows a cash payment; since 2007 the mandatory part
    stays in Switzerland while the person is compulsorily insured in the EU/EFTA state.
  steps:
  - search:
      query: pension fund cash payment moving to Munich for good
      expect_concept: bvg-cash-out-departure
      expect_strength: strong
  - resolve:
      concept_ids:
      - bvg-cash-out-departure
      context:
        destination: eu_efta
      expect_status:
        bvg-cash-out-departure: SUPPORTED
  - resolve:
      concept_ids:
      - bvg-cash-out-departure
      context:
        destination: other
      expect_status:
        bvg-cash-out-departure: SUPPORTED
  claims:
  - claim: Since 1 June 2007 no cash payment on moving to the EU while insured there
    concept: bvg-cash-out-departure
    statement_contains:
    - since 1 June 2007
    - remains insured there
    excerpt_contains:
    - seit dem 1. Juni 2007 nicht mehr möglich, wenn die Person in diesem Land weiter gegen die Risiken Alter, Tod
      und Invalidität versichert ist
  - claim: The extra-mandatory part can still be paid out
    concept: bvg-cash-out-departure
