  - claim: The representation forwards the application to the canton
    concept: entry-visa-application
    fact_id: entry-visa-application-3
    statement_contains:
    - forwards the visa application to the cantonal migration office
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    must_mention:
      visa_d: (?:type )?D|national visa
      canton: cantonal migration office
    must_not:
      schengen_for_work: Schengen visa (?:C )?(?:is|would be) (?:enough|sufficient)
    cites:
      sem_faq: themen/einreise/faq
      fdfa: visabestimmungen-fuer-die-einreise
    resolved:
    - entry-visa-types
