  question: I am leaving Zurich for good and moving back to India next month. When do I have to deregister, and
    what happens with my taxes?
  expected_answer: Report the departure at the earliest 30 days before and at the latest 14 days after moving out,
    for a move abroad with the deregistration declaration through the contact form or in person by appointment;
    moving abroad ends the tax liability in the City of Zurich and all taxes, including provisional ones, become
    due, so the person contacts the City's tax office; a tax representative in Switzerland is needed in the cases
    the page names. The City of Zurich pages are cited.
