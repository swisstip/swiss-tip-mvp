- case_id: UAT-35
  label: 'Another canton: a German citizen with an eight-month contract in Bern'
  spec: docs/product/user-acceptance-tests.md#uat-35-permit-for-an-eight-month-contract-in-bern
  question: I'm a German citizen and have signed an eight-month employment contract with a company in Bern, where
    I will also live. Which permit will I get, and where do I apply for it?
  expected_answer: 'From the federal facts, which apply in every canton: a contract of more than three months and
    less than one year gives a residence permit valid for the duration of the contract (FZA Annex I Article 6(2)),
    which SEM names the short-stay permit L (contracts up to 364 days); the user registers with the municipality
    of residence and applies for the permit there within 14 days of arrival and before starting work, with a valid
    identity card or passport and the employer''s written confirmation of employment; permits are issued by the
    cantonal migration offices, and SEM''s directory names Bern''s (Amt für Bevölkerungsdienste des Kantons Bern,
    Ostermundigenstrasse 99B, 3006 Bern, +41 31 633 53 15). The answer says that the release publishes no Bern procedure,
    form, fee or opening hours, and computes no date before the arrival date is known. The SEM free-movement FAQ
    (and the FZA or SEM''s directory where quoted) is cited.'
  trap: 'Filling the Bern gap from the Canton of Zurich''s page: its working-time condition of more than fifteen
    hours a week, its procedure, or the Zurich Migration Office''s address and hours presented as Bern''s; resolving
    for CH-ZH because the release is a Zurich pack; or refusing the whole question although the federal rules answer
    it.'
  steps:
  - search:
      query: EU citizen employment contract eight months residence permit Bern
      expect_concept: fza-employee-permit
      expect_strength: strong
  - resolve:
      concept_ids:
      - fza-employee-permit
      - eu-employment-registration-deadline
      - permit-authority
      - cantonal-migration-contact
      - zh-eu-l
      jurisdiction:
        canton_code: CH-BE
      context:
        population: eu_efta
      expect_status:
        fza-employee-permit: SUPPORTED
        eu-employment-registration-deadline: SUPPORTED
        permit-authority: SUPPORTED
        cantonal-migration-contact: SUPPORTED
        zh-eu-l: OUT_OF_COVERAGE
      expect_gap:
        fza-employee-permit: more_specific_jurisdiction_not_published
        eu-employment-registration-deadline: more_specific_jurisdiction_not_published
        permit-authority: more_specific_jurisdiction_not_published
        zh-eu-l: jurisdiction_not_covered
      expect_basis:
        fza-employee-permit: 'International agreement: FZA, SR 0.142.112.681, Annex I, Art. 6'
        cantonal-migration-contact: Federal authority directory
  claims:
  - claim: A contract of more than three months and less than one year gives a permit for the contract's duration
    concept: fza-employee-permit
    fact_id: fza-employee-permit-2
    statement_contains:
    - more than three months and less than one year
    - valid for the duration of the employment contract
    excerpt_contains:
    - mehr als drei Monaten und weniger als einem Jahr
    - die der Dauer des Arbeitsvertrags entspricht
  - claim: SEM names it the short-stay permit L, for contracts up to 364 days
    concept: eu-employment-registration-deadline
    fact_id: eu-employment-registration-deadline-1
    statement_contains:
    - short-stay permit L
    excerpt_contains:
    - Ausweis L, Arbeitsvertrag bis 364 Tage
  - claim: Registration with the municipality of residence within 14 days and before starting work
    concept: eu-employment-registration-deadline
    fact_id: eu-employment-registration-deadline-1
    statement_contains:
    - municipality of residence
    - within 14 days
    - before starting work
    excerpt_contains:
    - Innert 14 Tagen nach ihrer Ankunft
    - bei ihrer Wohngemeinde anmelden
  - claim: Permits are issued by the cantonal migration offices
    concept: permit-authority
    statement_contains:
    - issued by the cantonal migration offices
    excerpt_contains:
    - Residence permits are issued by the Cantonal Migration Offices
  - claim: SEM's directory names the Bern migration office
    concept: cantonal-migration-contact
    fact_id: cantonal-migration-contact-be
    statement_contains:
    - Canton Bern
    - Ostermundigenstrasse 99B
    excerpt_contains:
    - Ostermundigenstrasse 99B 3006 Bern
  must_not_serve:
  - zh-eu-l-1
  - cantonal-migration-contact-zh
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A10
    must_mention:
      short_stay_permit: short[- ]stay|\bL\b[ -]?permit|permit L\b|Ausweis L\b|\bL EU/EFTA
      fourteen_days: \b14\b|fourteen
      municipality: municipalit|commune|Gemeinde|residents.{0,3} (?:registration )?office
    must_not:
      zurich_migration_office: Berninastrasse|43 259 88 00
      zurich_working_time_condition: (?:15|fifteen) hours
    cites:
      sem_faq: eu-efta_buerger_schweiz/faq
    resolved:
    - eu-employment-registration-deadline
- case_id: UAT-36
  label: 'Another canton: living in Baden (Aargau), working in Zurich - where to register'
  spec: docs/product/user-acceptance-tests.md#uat-36-living-in-aargau-and-working-in-zurich
  question: I'm a French citizen. I have rented a flat in Baden in the Canton of Aargau and start a permanent job
    in Zurich next month. Where do I have to register, and which office issues my residence permit?
  expected_answer: 'Registration follows the place of residence, not the place of work: the user registers with
