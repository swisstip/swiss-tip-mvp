  spec: docs/product/user-acceptance-tests.md#uat-30-kindergarten-entry-after-the-31-july-cut-off
  question: Our daughter was born on 10 August 2023 and we have just moved to the city of Zurich. When does she
    start kindergarten, and how do we register her?
  expected_answer: 'Children who are four by 31 July start that summer; she turns four on 10 August 2027, so she
    starts in the summer of 2028, not 2027 (the release serves the dates of 2026/27 and 2027/28 only). Registration:
    from mid-November before the start the School Office writes with the «Meine Kinder» registration; a family that
    gets no letter contacts its district school authority (Kreisschulbehörde); a German questionnaire comes one
    and a half years before entry. The City of Zurich kindergarten and school-entry pages are cited.'
  trap: Starting in August 2027 because she is four by the school start; the 31 July cut-off is missed.
  steps:
  - search:
      query: kindergarten registration Zurich age
      expect_concept: city-zurich-kindergarten
      expect_strength: strong
  - resolve:
      concept_ids:
      - city-zurich-kindergarten
      jurisdiction:
        canton_code: CH-ZH
        municipality_id: CH-ZH-261
      expect_status:
        city-zurich-kindergarten: SUPPORTED
  claims:
  - claim: Children four years old by 31 July start that year
    concept: city-zurich-kindergarten
    fact_id: city-zurich-kindergarten-1
    statement_contains:
    - four years old by 31 July
    excerpt_contains:
    - Eingeschult werden Kinder, die bis zum 31. Juli vier Jahre alt sind
  - claim: Families moving in later contact the district school authority
    concept: city-zurich-kindergarten
    fact_id: city-zurich-kindergarten-3
    statement_contains:
    - Kreisschulbehörde
    excerpt_contains:
    - ziehen zu einem späteren Zeitpunkt in den Schulkreis
  - claim: A German questionnaire one and a half years before entry
    concept: city-zurich-kindergarten
    fact_id: city-zurich-kindergarten-4
    statement_contains:
    - one and a half years before kindergarten
    excerpt_contains:
    - 1,5 Jahre vor dem Eintritt in den Kindergarten
  answer:
    criteria:
    - A1
    - A2
    - A3
    - A4
    - A5
    - A6
    - A7
    must_mention:
      cut_off: 31 July
      year: '2028'
    cites:
      kindergarten: volksschule/schullaufbahn
    resolved:
    - city-zurich-kindergarten
- case_id: UAT-31
  label: 'Lost access code for the online tax return, in German: not from the city'
