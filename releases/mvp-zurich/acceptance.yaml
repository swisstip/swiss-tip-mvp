- case_id: UAT-48
  label: ETIAS before flying, and the passport stamp
  spec: docs/product/user-acceptance-tests.md#uat-48-etias-before-flying-and-the-passport-stamp
  question: Do I have to apply for ETIAS before I fly to Zurich next month, and will my passport still be stamped
    at the border?
  expected_answer: 'On the cited SEM page no ETIAS application can be filed yet and travellers need take no steps;
    the EU will announce the date a few months in advance, and once it runs an authorisation costs EUR 20 and is
    valid up to three years without guaranteeing entry. The passport stamp is being replaced: since 12 October 2025
    the Entry/Exit System records entries and exits of third-country nationals electronically and calculates the
