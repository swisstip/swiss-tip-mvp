  label: Four months of service
  spec: docs/product/user-acceptance-tests.md#uat-91-four-months-of-service
  question: I am starting four months of civilian service. Do I keep paying my health insurance?
  expected_answer: The duty to insure is suspended for people subject to the military insurance for
    more than 60 consecutive days, and the suspension begins on the day they become subject to it.
    The insured is freed from paying premiums from that start only if they tell their insurer at
    least eight weeks beforehand; otherwise the insurer stops charging from the next date it can
    manage, at the latest eight weeks after being told.
  trap: Answering that premiums simply continue, or that the suspension happens by itself without
    the caller doing anything.
