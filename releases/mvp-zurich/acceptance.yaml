- case_id: UAT-51
  label: Twelve years on a C permit in the city of Zurich, asking to vote in the city elections
  spec: docs/product/user-acceptance-tests.md#uat-51-voting-in-the-city-elections-after-twelve-years-on-a-c-permit
  question: I have had a C permit for twelve years and live in the city of Zurich. Can I vote in the city elections
    next spring?
  expected_answer: No. In the Canton of Zurich, including the City, the right to vote and elect in cantonal and
    communal matters belongs to Swiss citizens who live in the canton and are 18 or over (Constitution of the Canton
    of Zurich, Art. 22); foreign nationals cannot vote or elect at federal level either, whatever their permit or
    length of stay. The one exception the canton names is the elections and votes of the Evangelical Reformed church,
    where B, C and Ci permit holders may vote. The cantonal constitution (Fedlex) and the Canton of Zurich's voting
    page are cited; naturalisation may be named as the route to the vote.
  trap: A yes because of the long stay or the C permit, or "some municipalities allow it" carried over from other
    cantons; the church exception presented as a general municipal vote.
  steps:
  - search:
      query: voting rights foreigners city of Zurich elections C permit
      expect_concept: zh-political-rights
      expect_strength: strong
  - resolve:
      concept_ids:
      - zh-political-rights
      - political-rights-federal
      jurisdiction:
        canton_code: CH-ZH
        municipality_id: CH-ZH-261
      expect_status:
        zh-political-rights: SUPPORTED
        political-rights-federal: SUPPORTED
      expect_basis:
        zh-political-rights: 'Cantonal act: KV ZH, SR 131.211, Art. 22'
  claims:
  - claim: Cantonal and communal political rights belong to Swiss citizens resident in the canton
    concept: zh-political-rights
    fact_id: zh-political-rights-1
    statement_contains:
    - all Swiss citizens who live in the canton
    excerpt_contains:
    - stehen allen Schweizerinnen und Schweizern zu, die im Kanton wohnen
  - claim: No vote for foreign nationals at federal level
    concept: political-rights-federal
    fact_id: political-rights-federal-3
    statement_contains:
    - neither vote nor elect at federal level
    excerpt_contains:
    - können auf Bundesebene weder an Abstimmungen noch an Wahlen teilnehmen
  - claim: The Evangelical Reformed church lets B, C and Ci permit holders vote
    concept: zh-political-rights
    fact_id: zh-political-rights-3
    statement_contains:
    - B, C or Ci residence permit
    excerpt_contains:
    - Aufenthaltsbewilligung des Typs B, C oder Ci stimmberechtigt
  not_served:
    zh-political-rights:
    - dates, subjects and results of votes and elections
  answer:
    criteria:
