  - resolve:
      concept_ids: [moving-registration]
      jurisdiction: {country: Schweiz, canton: Kanton Zürich, city: Stadt Wallisellen}
      expect_status: {moving-registration: SUPPORTED}
      expect_scope: CH-ZH-69
      expect_not_recognised: []
  - resolve:
      concept_ids: [moving-registration]
      jurisdiction: {canton: ZH, city: "69"}
      expect_status: {moving-registration: SUPPORTED}
      expect_scope: CH-ZH-69
  claims:
  - claim: The move must be reported within 14 days
    concept: moving-registration
    statement_contains: [within 14 days]
    excerpt_contains: [melden Sie Ihren Umzug innert 14 Tagen]

