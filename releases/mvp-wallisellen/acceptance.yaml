  spec: docs/product/wallisellen-user-acceptance-tests.md#place-cases
  question: I have just moved to Wallisellen. By when do I have to report my move?
  expected_answer: >-
    The caller names the place instead of its code. The city alone is turned into CH-ZH-69 and supplies the canton;
    the German form with the generic words a caller copies from the user ("Kanton Zürich", "Stadt Wallisellen") and
