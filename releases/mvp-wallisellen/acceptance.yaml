    excerpt_contains: [melden Sie Ihren Umzug innert 14 Tagen]
  - claim: A move can be reported through the eUmzugCH portal
    concept: moving-registration
    statement_contains: [eUmzugCH portal]
    excerpt_contains: [über das Portal eUmzugCH]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      fourteen_days: '\b14\b[- ]?(?:calendar )?days?|fourteen days'
      online_portal: 'eUmzug'
    must_not:
      fee_amount: 'CHF\s*\d|\d+\s*(?:CHF|francs)'
      in_person_required: '(?:you|one) (?:must|have to|need to) (?:register|report|appear|come) in[- ]person'
    cites:
