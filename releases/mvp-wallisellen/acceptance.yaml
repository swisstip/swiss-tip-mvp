  spec: docs/product/wallisellen-user-acceptance-tests.md#place-cases
  question: I have just moved from Winterthur to Wallisellen. By when do I have to report my move, and can I do it online?
  expected_answer: >-
    The session's prompt states neither the municipality nor its code: the caller takes the place from the user's
    words and gives it to resolve, where the server turns the name into CH-ZH-69. The move must be reported within
    14 days, and a move within Switzerland can be reported through the eUmzugCH portal; the in-person exceptions
    (arrival from abroad, weekly residents) do not apply and are not presented as if they did. Nothing of Winterthur,
    the place the user left, or of the City of Zurich is served; no fee, document list or appointment is invented.
  trap: >-
    Resolving for the canton only, for Winterthur or for the City of Zurich because no code was given, or sending a
    guessed municipality number.
  steps:
  - resolve:
      concept_ids: [moving-registration]
      jurisdiction: {city: Wallisellen}
      expect_status: {moving-registration: SUPPORTED}
      expect_scope: CH-ZH-69
      expect_not_recognised: []
