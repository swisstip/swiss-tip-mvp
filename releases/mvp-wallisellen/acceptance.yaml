- case_id: W-PROBE-4
  label: "next waste pickup: dates by area, no area for an address"
  spec: docs/product/wallisellen-user-acceptance-tests.md#cross-cutting-boundary-probes
  question: When is my next household-waste pickup?
  expected_answer: >-
    No collection date is manufactured for the user's address: household waste is collected on Wednesdays in Gebiet
    Blau and on Thursdays in Gebiet Gelb, with the listed dates of both areas; the area of the user's street is not
    served, so the answer asks for or points to the area instead of choosing one. The calendar import and the
    reminder mechanism may be mentioned.
  trap: Choosing an area, and so a date, for the user's address.
  steps:
  - search:
      query: next household waste pickup
      expect_concept: waste-collection-schedule
  - resolve:
      concept_ids: [waste-collection-schedule, waste-disposal-services]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      expect_status: {waste-collection-schedule: SUPPORTED, waste-disposal-services: SUPPORTED}
  claims:
  - claim: Household waste is collected on Wednesdays in Gebiet Blau and on Thursdays in Gebiet Gelb
    concept: waste-collection-schedule
    statement_contains: [every Wednesday in Gebiet Blau, every Thursday in Gebiet Gelb]
    excerpt_contains: [Im Gebiet BLAU jeweils am Mittwoch, GELB am Donnerstag]
  - claim: The listed household-waste dates of Gebiet Blau include 23 September 2026
    concept: waste-collection-schedule
    statement_contains: ["household-waste (Haushaltkehricht) collection dates for Gebiet Blau", "16, 23 and 30 September"]
    excerpt_contains: [Haushaltkehricht Blau, 23.09.2026]
  - claim: Collection is organised by the areas Gebiet Blau and Gebiet Gelb
    concept: waste-disposal-services
    statement_contains: [Gebiet Blau, Gebiet Gelb]
    excerpt_contains: [Nach Kreis einschränken, Gebiet Blau, Gebiet Gelb]
  - claim: All collection dates can be taken over into the user's calendar
    concept: waste-disposal-services
    statement_contains: [import all dates into the user's calendar]
    excerpt_contains: [Alle Termine in meinen Kalender übernehmen]
  not_served:
    waste-disposal-services: [specific address]
    waste-collection-schedule: [specific street or address]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      both_areas: '(?:Gebiet )?Blau|blue'
      area_unknown: 'which (?:area|zone)|your (?:area|zone)|(?:area|zone) (?:of|for) your|depends on'
    must_not:
      address_area: 'your (?:street|address|home) is in (?:the )?(?:Gebiet )?(?:Blau|Gelb|blue|yellow)'
    resolved: [waste-collection-schedule]

- case_id: W-PROBE-5
  label: waste calendar and collection reminders
  spec: docs/product/wallisellen-user-acceptance-tests.md#cross-cutting-boundary-probes
  question: Will Wallisellen email every resident automatically before collection?
