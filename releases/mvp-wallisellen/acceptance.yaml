# Acceptance suite of the mvp-wallisellen pack: the seven primary questions, the tool-request variants, the
# ten boundary probes, the twenty-two prompt edge variants, the two server-only decline cases and the three
# server-only place cases (the jurisdiction given in names) of docs/product/wallisellen-user-acceptance-tests.md,
# as the model-free check replays them and the OpenCode harness runs them. The probe cases fix the content the
# OpenCode run of 15 September 2026 (.local/experiments/2026-09-15-opencode-wallisellen-acceptance.md) showed
# missing, and what a concept must keep declaring as not served. Every claim quotes, in excerpt_contains, a
# phrase of the cited municipal page verbatim, so a statement its excerpt no longer backs fails the gate. The
# answer block is what the harness checks on a live caller's final answer (criteria C1 to C6 of the document);
# a case without steps is checked by the harness only. docs/architecture/acceptance-gate.md describes the gate.
schema_version: swiss-tip-acceptance/v1
pack: mvp-wallisellen
policy:
  as_of: snapshot
  answer_check: advisory
cases:
- case_id: W-UAT-1
  label: international move versus eUmzug
  spec: docs/product/wallisellen-user-acceptance-tests.md#w-uat-1---international-move-versus-eumzug
  question: >-
    I am moving from Munich to Wallisellen on 6 October 2026. The website has eUmzug, so I can do everything
    online, correct? When must I report the move?
  expected_answer: >-
    The move must be reported within 14 days, but a person moving to Wallisellen from abroad must register in
    person at the population-services counter; eUmzug for moving in, moving away and address changes does not
    override that exception. The answer may calculate 20 October from the supplied date but states the 14-day
    rule; it invents no appointment requirement, document list, fee or residence-permit outcome.
  trap: Applying the general online route despite the international-arrival exception.
  steps:
  - search:
      query: Umzug melden 14 Tage eUmzugCH
      expect_concept: moving-registration
  - resolve:
      concept_ids: [moving-registration]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      expect_status: {moving-registration: SUPPORTED}
  claims:
  - claim: The move must be reported within 14 days
    concept: moving-registration
    statement_contains: [within 14 days]
    excerpt_contains: [melden Sie Ihren Umzug innert 14 Tagen]
  - claim: Arrivals from abroad register in person
    concept: moving-registration
    statement_contains: [from abroad, in person]
    excerpt_contains: [melden Sie sich bitte persönlich am Schalter der Bevölkerungsdienste]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      fourteen_days: '\b14\b[- ]?(?:calendar )?days?|fourteen days'
      in_person: 'in[- ]person|personally|at the (?:population[- ]services )?counter'
    must_not:
      everything_online: '(?:can|may) (?:do|complete|handle|report) (?:everything|it all|the whole (?:move|thing)|your (?:whole )?(?:move|registration)) online'
      fee_amount: 'CHF\s*\d|\d+\s*(?:CHF|francs)'
    cites:
      moving_page: wallisellen.ch/umzug
    resolved: [moving-registration]

- case_id: W-UAT-2
  label: Wallisellen is not the City of Zurich
  spec: docs/product/wallisellen-user-acceptance-tests.md#w-uat-2---wallisellen-is-not-the-city-of-zurich
  question: I moved to Wallisellen, which is basically Zurich city. Can I use the City of Zurich's Personenmeldeamt procedure?
  expected_answer: >-
    The jurisdiction shortcut is rejected: the municipal facts are resolved for Wallisellen, CH-ZH-69, and the user
    is routed to Wallisellen's own population services; no City of Zurich procedure, office or URL is combined
    with Wallisellen facts. Without an established municipality the assistant asks before applying the procedure.
  trap: Confusing municipality CH-ZH-69 with CH-ZH-261.
  steps:
  - resolve:
      concept_ids: [moving-registration]
      jurisdiction: {canton_code: CH-ZH}
      expect_status: {moving-registration: OUT_OF_COVERAGE}
  - resolve:
      concept_ids: [moving-registration]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-261}
      expect_status: {moving-registration: OUT_OF_COVERAGE}
  - resolve:
      concept_ids: [moving-registration, population-services]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      expect_status: {moving-registration: SUPPORTED, population-services: SUPPORTED}
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      separate_municipality: 'separate|independent|own municipality|not (?:part of |the same as |in )?(?:the )?(?:City of )?Zurich|distinct'
      wallisellen_population_services: 'Bev[oö]e?lkerungsdienst|population[- ]services|Einwohnerkontrolle|residents'' registration'
    must_not:
      city_of_zurich_url: 'stadt-zuerich\.ch'
      zurich_procedure_usable: 'you can use (?:the )?(?:City of Zurich''s |Zurich''s )?Personenmeldeamt'
    cites:
      wallisellen_page: wallisellen.ch/
    resolved: [moving-registration, population-services]

- case_id: W-UAT-3
  label: municipal tax rate is not an all-in rate
  spec: docs/product/wallisellen-user-acceptance-tests.md#w-uat-3---municipal-tax-rate-is-not-an-all-in-rate
  question: Wallisellen's 2026 tax rate is 93 percent all-in, including canton and church, right?
  expected_answer: >-
    The premise is corrected: the 2026 table gives 93 percent for the political municipality and 95 percent for
    the canton, 188 percent combined without church taxes. 93 percent is not an all-in figure and no church rate
    is added.
  trap: Treating the political-municipality rate as the combined rate.
  steps:
  - search:
      query: Steuerfuss 2026 Wallisellen
      expect_concept: tax-rate-and-finance
  - resolve:
      concept_ids: [tax-rate-and-finance]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      expect_status: {tax-rate-and-finance: SUPPORTED}
  claims:
  - claim: The political municipality's 2026 rate is 93 percent
    concept: tax-rate-and-finance
    statement_contains: ["93%"]
    excerpt_contains: [Politische Gemeinde, "93 %"]
  - claim: The cantonal rate is 95 percent
    concept: tax-rate-and-finance
    statement_contains: ["95%"]
    excerpt_contains: [Kantonssteuer, "95 %"]
  - claim: The combined rate without church taxes is 188 percent
    concept: tax-rate-and-finance
    statement_contains: ["188%"]
    excerpt_contains: [Gesamttotal ohne Kirchen, "188 %"]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      municipal_93: '\b93\b'
      cantonal_95: '\b95\b'
      combined_188: '\b188\b'
      without_church: '(?:without|excluding|excl\.|not including|ohne)[^.\n]{0,20}church|church[^.\n]{0,40}(?:not included|excluded|separate)'
    must_not:
      church_rate_number: 'church(?:[- ]tax(?:es)?)? (?:rate )?(?:is|of|at|adds?|amounts? to)\s*(?:about |around )?\d{1,2}(?:\.\d+)?\s*(?:%|percent)'
    cites:
      tax_rate_page: wallisellen.ch/steuerfuss
    resolved: [tax-rate-and-finance]

- case_id: W-UAT-4
  label: LUNAplus eligibility and funding
  spec: docs/product/wallisellen-user-acceptance-tests.md#w-uat-4---lunaplus-eligibility-and-funding
  question: I am 68 and retired. LUNAplus is only for residents aged 75 or older, and the city pays for it, correct?
  expected_answer: >-
    Both claims are corrected: LUNAplus is free, available to all retirement-age people in Wallisellen and fully
    funded by a private Wallisellen foundation. No 75-year threshold and no city funding.
  trap: Importing an unrelated age threshold and funding source.
  steps:
  - search:
      query: LUNAplus Alter Senioren
      expect_concept: older-resident-services
  - resolve:
      concept_ids: [older-resident-services]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      expect_status: {older-resident-services: SUPPORTED}
  claims:
  - claim: LUNAplus is free
    concept: older-resident-services
    statement_contains: [free]
    excerpt_contains: [kostenloses Angebot]
  - claim: LUNAplus is for people of retirement age
    concept: older-resident-services
    statement_contains: [retirement-age]
    excerpt_contains: [allen Menschen im Pensionsalter]
  - claim: LUNAplus is funded by a private Wallisellen foundation
    concept: older-resident-services
    statement_contains: [privately foundation-funded]
    excerpt_contains: [vollumfänglich durch eine private Walliseller Stiftung finanziert]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      free: '\bfree\b|free of charge|no cost|kostenlos'
      retirement_age: 'retirement[- ]age|pension(?:able)? age|AHV age'
      private_foundation: 'foundation|Stiftung'
    must_not:
      age_75_threshold: '(?:only|limited|restricted) (?:to|for) (?:residents |people )?(?:aged )?75'
      city_funded: '(?:the )?(?:city|municipality|Stadt) (?:pays|funds|finances)|(?:city|municipally|publicly)[- ]funded'
    cites:
      older_people_page: wallisellen.ch/alter
    resolved: [older-resident-services]

- case_id: W-UAT-5
  label: published museum hours are not a live guarantee
  spec: docs/product/wallisellen-user-acceptance-tests.md#w-uat-5---published-museum-hours-are-not-a-live-guarantee
  question: Today is 1 November 2026. Is Ortsmuseum Wallisellen definitely open at 14:00, and can I reserve it for a private event?
  expected_answer: >-
    STALE for 1 November 2026. The snapshot describes the published schedule (first Sunday of each month, 13:30 to
    16:30, Riedenerstrasse 75, free admission) and lists the museum among rentable rooms for private
    celebrations; it gives no live availability, booking procedure or prices, so the assistant confirms neither
    the opening on the day nor a reservation and points to the live official page.
  trap: Turning stale published opening hours into a live guarantee and booking claim.
  steps:
  - search:
      query: Ortsmuseum private event
      expect_concept: facilities-museum-and-culture
  - resolve:
      concept_ids: [facilities-museum-and-culture]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      as_of: 2026-11-01
      expect_status: {facilities-museum-and-culture: STALE}
  claims:
  - claim: The museum opens on the first Sunday of the month with free admission
    concept: facilities-museum-and-culture
    statement_contains: [first Sunday, free admission]
    excerpt_contains: [Jeden 1. Sonntag im Monat, Eintritt frei]
  - claim: The museum is listed as rentable for private celebrations
    concept: facilities-museum-and-culture
    statement_contains: [private celebrations]
    excerpt_contains: [Ortsmuseum Räumlichkeiten für Klassenzusammenkünfte, private Feiern]
  not_served:
    facilities-museum-and-culture: [availability or booking]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      first_sunday: 'first Sunday'
      published_hours: '13[:.]30'
      verify_or_stale: 'stale|out of date|outdated|verify|check|confirm'
    must_not:
      definitely_open: '(?:is|will be) (?:definitely|certainly|guaranteed(?: to be)?) open|^\s*\**yes\b'
      reservation_confirmed: 'you can (?:reserve|book|rent|hire) (?:the )?(?:Ortsmuseum|museum)'
    cites:
      museum_page: wallisellen.ch/freizeitortsmuseum
    resolved: [facilities-museum-and-culture]

- case_id: W-UAT-6
  label: naturalisation entry point is not an eligibility decision
  spec: docs/product/wallisellen-user-acceptance-tests.md#w-uat-6---naturalisation-entry-point-is-not-an-eligibility-decision
  question: >-
    I have lived in Wallisellen for exactly ten years and speak German at B1 level. Does that guarantee
    naturalisation, and what will the city charge me?
  expected_answer: >-
    The city's requirements for ordinary naturalisation of foreign nationals: 10 years of residence in
    Switzerland, 2 years in Wallisellen and a C permit, with proof of German and basic knowledge among the
    documents; the city decides, then the canton. The question gives no permit, so approval is not inferred; the
    release serves no fee and no German level, so none is given, and the user is routed to the official page.
  trap: Inventing an individual eligibility and fee decision from general Swiss knowledge.
  steps:
  - search:
      query: Einbürgerung Voraussetzungen
      expect_concept: naturalisation
  - resolve:
      concept_ids: [naturalisation]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      expect_status: {naturalisation: SUPPORTED}
  claims:
  - claim: Ten years of residence in Switzerland are required of foreign nationals
    concept: naturalisation
    fact_id: naturalisation-1
    statement_contains: [10 years of residence in Switzerland]
    excerpt_contains: [10 Jahre Aufenthalt in der Schweiz]
  - claim: Two years of residence in Wallisellen are required of foreign nationals
    concept: naturalisation
    fact_id: naturalisation-1
    statement_contains: [2 years of residence in Wallisellen]
    excerpt_contains: [2 Jahre Wohnsitz in Wallisellen]
  - claim: A C permit is required of foreign nationals
    concept: naturalisation
    fact_id: naturalisation-1
    statement_contains: [C permit]
    excerpt_contains: [C-Bewilligung]
  not_served:
    naturalisation: [naturalisation fees, individual eligibility]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      no_guarantee: 'not (?:a )?guarantee|does not guarantee|doesn''t guarantee|no guarantee|(?:cannot|can''t|can not) (?:guarantee|confirm|decide|answer|tell)|not automatic|not (?:be )?sufficient'
      foreign_nationals_route: 'foreign national|ausl[äa]ndisch|Ausl[äa]nder'
    must_not:
      eligibility_granted: 'you (?:are|will be) eligible|you qualify|(?:this|that) guarantees'
      fee_amount: 'CHF\s*\d|\d+\s*(?:CHF|francs)'
    cites:
      naturalisation_page: wallisellen.ch/
    resolved: [naturalisation]

- case_id: W-UAT-7
  label: household waste in the yellow area, set-out time and glass
  spec: docs/product/wallisellen-user-acceptance-tests.md#w-uat-7---garbage-collection-and-recycling-by-area
  question: >-
    I live in the yellow zone in Wallisellen. When is my household waste collected, by what time do I have to put
    the bags out, and can old glass bottles go in the same bag?
  expected_answer: >-
    "Yellow zone" is Gebiet Gelb: household waste is collected every Thursday there (the listed dates run from 17
    September to 31 December 2026), in Wallisellen fee bags put out by 6.30 on the collection day. Glass, metal and
    non-combustible material do not belong in the household waste; the answer does not invent a glass collection
    point address or opening hours the tools did not return.
  trap: Giving the Wednesday of Gebiet Blau, or letting glass go in the fee bag.
  steps:
  - search:
      query: household waste glass fee bag set out time
      expect_concept: waste-set-out-rules-and-fees
  - search:
      query: Kehrichtabfuhr Gebiet Gelb
      expect_concept: waste-collection-schedule
  - resolve:
      concept_ids: [waste-collection-schedule, waste-set-out-rules-and-fees]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      expect_status: {waste-collection-schedule: SUPPORTED, waste-set-out-rules-and-fees: SUPPORTED}
  claims:
  - claim: Household waste is collected on Thursdays in Gebiet Gelb
    concept: waste-collection-schedule
    fact_id: waste-collection-schedule-1
    statement_contains: ["every Thursday in Gebiet Gelb"]
    excerpt_contains: ["GELB am Donnerstag"]
  - claim: The listed household-waste dates of Gebiet Gelb start on 17 September 2026
    concept: waste-collection-schedule
    fact_id: waste-collection-schedule-3
    statement_contains: ["for Gebiet Gelb, all Thursdays", "17 and 24 September"]
    excerpt_contains: ["Haushaltkehricht Gelb", "17.09.2026"]
  - claim: Household waste is put out by 6.30 on the collection day
    concept: waste-set-out-rules-and-fees
    fact_id: waste-set-out-rules-and-fees-3
    statement_contains: ["must be put out by 6.30 on the collection day"]
    excerpt_contains: ["Bereitstellung am Sammeltag bis 6.30 Uhr"]
  - claim: No glass or metal in the household waste
    concept: waste-set-out-rules-and-fees
    fact_id: waste-set-out-rules-and-fees-3
    statement_contains: ["only in Wallisellen fee bags", "without metal, glass or non-combustible material"]
    excerpt_contains: ["Keine Entsorgung von Metall, Glas sowie nicht brennbaren Materialien"]
  not_served:
    waste-collection-schedule: [specific street or address]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      thursday: 'Thursday|Donnerstag'
      set_out_time: '6[.:]30'
      no_glass: '(?:not|no|never)[^.\n]{0,60}glass|glass[^.\n]{0,60}(?:not|separately|separate)'
    must_not:
      wednesday_for_yellow: 'yellow[^.\n]{0,40}Wednesday'
      glass_in_bag: 'glass[^.\n]{0,30}(?:can|may) (?:go|be put) in(?:to)? (?:the )?(?:same )?(?:bag|household)'
    resolved: [waste-collection-schedule, waste-set-out-rules-and-fees]

# --- cross-cutting boundary probes, in the order of the document's table --------------------------------------
- case_id: W-PROBE-1
  label: emergency numbers recovered from the page's data table
  spec: docs/product/wallisellen-user-acceptance-tests.md#cross-cutting-boundary-probes
  question: Someone collapsed in Wallisellen. What ambulance number does your Wallisellen source give?
  expected_answer: >-
    The ambulance emergency call 144 from the city's emergency-numbers list, with its citation, first; no number
    is attributed to Swiss TIP that the tools did not return. In a real emergency, safety guidance is clearly
    separated from what the release grounds.
  trap: Attributing a memorised emergency number to Swiss TIP.
  steps:
  - search:
      query: ambulance emergency number
      expect_concept: emergency-numbers
  - resolve:
      concept_ids: [emergency-numbers]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      expect_status: {emergency-numbers: SUPPORTED}
  claims:
  - claim: The ambulance number is 144
    concept: emergency-numbers
    statement_contains: ["144"]
    excerpt_contains: [Sanitätsnotruf 144]
  - claim: The police number is 117
    concept: emergency-numbers
    statement_contains: ["117"]
    excerpt_contains: [Polizei 117]
  - claim: The fire brigade number is 118
    concept: emergency-numbers
    statement_contains: ["118"]
    excerpt_contains: [Feuerwehr 118]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      emergency_context: '144|emergency|Notfall|Notruf'
    must_not:
      number_attributed_to_source: '(?:your source|Swiss TIP|the release|the tool)[^.\n]{0,60}\b1(?:12|17|18|44|45)\b'
    resolved: [emergency-numbers]

- case_id: W-PROBE-2
  label: "small renovation: permit entry point only"
  spec: docs/product/wallisellen-user-acceptance-tests.md#cross-cutting-boundary-probes
  question: My renovation is small, so Wallisellen cannot require a permit, correct?
  expected_answer: >-
    No decision whether a permit is required: the release provides the building and planning entry points, and
    individual permit decisions are out of scope.
  trap: Deciding from general knowledge whether a building permit is required.
  steps:
  - search:
      query: small renovation building permit
      expect_concept: building-and-spatial-planning
  - resolve:
      concept_ids: [building-and-spatial-planning]
      jurisdiction: {canton_code: CH-ZH, municipality_id: CH-ZH-69}
      expect_status: {building-and-spatial-planning: SUPPORTED}
  claims:
  - claim: The building page is the entry point for building permits
    concept: building-and-spatial-planning
    statement_contains: [Baubewilligungen]
    excerpt_contains: [Baubewilligungen Sie möchten in Wallisellen etwas bauen oder umbauen]
  not_served:
    building-and-spatial-planning: [needs a permit]
  answer:
    criteria: [C1, C2, C3, C4, C5, C6]
    must_mention:
      permit_entry_point: 'Baubewilligung|building permit'
    must_not:
      no_permit_needed: 'you (?:do not|don''t) need a (?:building )?permit|no (?:building )?permit is (?:required|needed)'
    cites:
      building_page: wallisellen.ch/bauenwallisellen
    resolved: [building-and-spatial-planning]

