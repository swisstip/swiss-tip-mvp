        excerpt: "Tiefbau + Landschaft\nUmwelt\nEntsorgungsinformation\nKehricht\nBrennbare, nicht wieder \nverwertbare\
          \ Siedlungsabfälle\nzum Beispiel: Kunststoffe, \nHygieneartikel, Styropor\nWalliseller Gebührensäcke.\n\
          Kehrichtabfuhr am \nMittwoch (Gebiet Blau) /\nDonnerstag (Gebiet Gelb).\nErst am Abfuhrtag vor 6:30 Uhr\
          \ \nam Kehrichtsammelplatz \nbereitstellen.\nKosten pro 17l-Kehrichtsack CHF 1.00 \nKosten pro 35l-Kehrichtsack\
          \ CHF 1.85\nKosten pro 60l-Kehrichtsack CHF 3.20 \nVerkauf im lokalen Detailhandel, Post \noder am Empfang\
          \ der Stadt\x02verwaltung.\nSperrgut\nSperriger Kehricht\nZum Beispiel: Möbel, Teppiche, \nMatratzen\n\
          Sperrgutmarken (Kleber).\nZusammen mit der \nKehrichtabfuhr, Maximalgewicht \n40 kg pro Stück. Abfuhrdaten\
          \ \nsiehe Entsorgungskalender. \nErst am Abfuhrtag vor 6:30 Uhr\nam Kehrichtsammelplatz \nbereitstellen.\n\
          Kosten pro Sperrgutmarke CHF 2.10\nVerkauf im lokalen Detailhandel, \nPost oder am Empfang der Stadt\x02\
          verwaltung.\nAltpapier\nZum Beispiel: Papier, Zeitungen, \nZeitschriften\nGebündelt bereitstellen, nicht\
          \ in \nPapiersäcken. Abfuhrdaten siehe \nEntsorgungskalender.\nErst am Abfuhrtag vor 8:00 Uhr \nam Kehrichtsammelplatz\
          \ \nbereitstellen.\nKeine Abfuhrkosten / Gebühren\nGrüngut\nBiologische Abfälle\nZum Beispiel: Rasenschnitt,\
          \ Laub, \nGartenabfälle, Rüstabfälle, \nSpeisereste\nNicht hinein gehören: Plastiksäcke\nGrüngutcontainer\
          \ oder Bündel.\nGebietsaufteilung Blau und Gelb\nsowie die Daten im Entsorgungs\x02kalender beachten.\n\
          Erst am Abfuhrtag vor 6:30 Uhr \nam Kehrichtsammelplatz \nbereitstellen.\nKeine Abfuhrkosten / Gebühren\n\
          Häckseldienst\nÄste, Sträucherschnitt und\nBaumschnitt max. 10 cm \nDurchmesser\nNicht hinein gehören:\
          \ Wurzelstöcke \nund Gartenabraum\nHäckseldienstdaten siehe \nEntsorgungskalender (Frühling \nund Herbst).\
          \ \nGratis bis max. 3 m3 oder ¼ Stunde, \nMehraufwand wird verrechnet.\nTelefonische Anmeldung unter \n\
          044 832 62 10.\nAltmetall\nAlle Arten von Metallen\nZum Beispiel: Gestelle, Pfannen, \nFahrradrahmen\n\
          Sammlung im Frühling und \nHerbst beim Stadthausparkplatz.\nSammeldatum siehe \nEntsorgungskalender.\n\
          Keine Abfuhrkosten / Gebühren.\nAbholservice während der \nSammlung nur auf Anmeldung \nunter 044 832\
          \ 62 10.\nKarton\nKartonverpackungen\nNicht hinein gehören: Styropor, \nTetra-Packungen, Kunststoffe\n\
          Trocken, gefaltet und gebunden \nbereitstellen. Alle vier Wochen.\nBitte Gebietsaufteilung Blau und \n\
          Gelb im Entsorgungskalender \nbeachten.\nKeine Abfuhrkosten / Gebühren.\nAluminium und Weissblech\nZum\
          \ Beispiel: Aluminium, Tuben, \nKonservendosen\nOhne Fremdmaterialien.\nKein Altmetall.\nStändige Annahme\
