schema_version: swiss-tip-curation/v1
pack: mvp-wallisellen
title: Stadt Wallisellen - municipal services, civic life and local information
scope_statement: 'Official Stadt Wallisellen information for residents and visitors: city contact and digital services;
  moving, population and civil-status services; waste, energy and climate; building, housing, public space and mobility;
  taxes and municipal finance; the city council, municipal assembly and legal collection; schools and careers advice;
  family, older-person, health, youth and volunteering services; leisure, sport, facilities and culture; and selected
  official facts about Wallisellen''s geography, population and business support.'
out_of_scope:
- Procedures or rules whose authoritative publisher is the Canton of Zurich, the Confederation or another municipality.
- Live news, event dates, vacancies, availability, appointment slots and the changing contents of directories or
  online forms.
- Full municipal legislation, downloadable files other than the five waste documents linked from the waste disposal
  page, and legal interpretation; the release only describes the official collection entry point.
- Individual eligibility or case decisions for naturalisation, benefits, permits, taxes, grants, housing or other
  public services.
- Commercial recommendations and exhaustive lists of businesses, associations, people, schools, facilities or attractions.
out_of_scope_response: Tell the user that the Wallisellen MVP does not cover that request, quote the scope statement,
  and direct them to the relevant official authority instead of answering from general knowledge as if it were grounded.
limitations:
- Every statement was written by an assistant from the cited official excerpt and confirmed against that excerpt
  by one named reviewer (`reviewed_by` on each fact) on 16 September 2026, recorded by an assistant on the reviewer's
  instruction; this is not a legal review.
- English statements paraphrase German municipal pages and are not official translations.
- The publishing office of each page and the basis of each excerpt (authority guidance or directory) were assigned
  by an assistant model with the classification prompt of the concept-extraction pipeline and confirmed by the same
  reviewer.
- The 50 selected pages were snapshotted without recursively acquiring linked forms, files, external sites or individual
  directory records; the only files are the five waste PDFs linked from the waste disposal page, whose layout and
  reading order were not verified. The collection-area map (Gebietsaufteilung blau / gelb) is an image without text,
  so the area of a street is not served.
- Collection dates are those listed on 15 September 2026 for the rest of 2026; the city can move a date after the
  snapshot.
- Directory, officeholder, contact, opening-hour, tax-rate, financial and population information can change; freshness
  reports the age of this snapshot, not whether the live page changed.
- A directory page proves that the city publishes that directory and its visible summary, not that every linked
  item is complete or currently available.
- Some tables on the city's pages are filled in by the browser; their rows were read from the data embedded in the
  saved page, so a row the browser would render differently can differ from the live page.
