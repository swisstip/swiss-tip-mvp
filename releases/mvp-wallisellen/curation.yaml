  - fact_id: naturalisation-4
    statement: 'All documents are submitted online through the e-Einbürgerung tool. The page lists the procedure:
      online application, review of the documents by the canton, processing by the city, an appointment for the
      assessment report, German and basic-knowledge assessments if necessary, a hearing by the city council''s naturalisation
      delegation if necessary, the naturalisation decision of Stadt Wallisellen, and the canton''s decision on admission
      to Swiss citizenship.'
