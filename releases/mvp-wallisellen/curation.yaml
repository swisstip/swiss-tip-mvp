  - fact_id: waste-disposal-services-6
    statement: According to the Entsorgungskalender 2026, the ReparierBar in the old fire station, Zentralstrasse
      4, opens on Saturdays from 9.00 to 12.00 on the calendar dates; volunteers repair household, electronic, metal,
      wood, textile and toy items free of charge, material is charged. The Bring- und Holboerse, Rosenbergstrasse
      2, is open every Thursday 16.00-18.00 and Saturday 10.00-12.00, closed in school holidays and on public holidays,
      for bringing and taking clean, working items free of charge. The main collection point Muelliland (REMONDIS
      Recycling AG, Kriesbachstrasse 2, 044 878 10 40) takes waste of all kinds during its opening hours, some fractions
      against a fee; the small-animal carcass collection point is REMONDIS Recycling AG, Kriesbachstrasse 1.
