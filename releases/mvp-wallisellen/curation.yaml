        excerpt: |-
          Doktorhaus

          1733 erbaute der damalige Lindenwirt und Landrichter David Ziegler an der Strasse nach Basserdorf - beim heutigen Kreuzplatz - anstelle einer etwas weiter östlich gelegenen, seit dem 15. Jahrhundert nachgewiesenen Taverne, ein stattliches Gasthaus, so wie wir es heute kennen. Nach der Eröffnung der Eisenbahnlinien nach Winterthur und Uster verlor das Gasthaus seine Kundschaft und wurde an einen Arzt verkauft. Fortan diente das Haus mehreren Ärzten als Arztpraxis und bekam den Namen "Doktorhaus"....

