        block_hashes:
        - a4d25d372a9b58d874ff3aeb635737cc5d46615a4c75b50b4d4e1639eae7dad5
        heading_path:
        - Steuern
        - Hundewesen
        start: 5617
        end: 6556
        excerpt: 'Meldepflicht Ersthundehalter/-innen müssen sich vorgängig bei den Bevölkerungsdiensten des Wohnortes
          melden. Diese erfassen Ihre Personalien in der zentralen Hundedatenbank AMICUS. Erst danach kann die Registrierung
          über den Tierarzt erfolgen. Alle Hundehalterinnen und Hundehalter sind neben der Meldung an AMICUS verpflichtet,
          ihre Hunde, welche älter als drei Monate sind, innert zehn Tagen bei den Bevölkerungsdiensten Wallisellen
          anzumelden. Innert derselben Frist sind den Bevölkerungsdiensten und AMICUS (www.amicus.chExterner Link
          wird in einem neuen Fenster geöffnet., info@amicus.ch oder Tel. 0848 777 100) folgende Mutationen zu melden:
          • Abgabe (z.B. Verkauf oder Schenkung) • Übernahme (z.B. Kauf oder Geschenk) • Ausfuhr und Tod des Hundes
          Namens- und Adressänderungen müssen direkt den Bevölkerungsdiensten bekanntgegeben werden. Zur Anmeldung
          benötigen wir: - Impfbüchlein / Hundepass oder PetCard - Haftpflichtversicherung'
      basis:
        level: municipal
        kind: guidance
