    statement: The city's waste information leaflet (Stand 2022) prices the Wallisellen fee bags for household waste
      at CHF 1.00 for 17 litres, CHF 1.85 for 35 litres and CHF 3.20 for 60 litres; they are sold in local shops,
      at the post office and at the reception of the city administration.
