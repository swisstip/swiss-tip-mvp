        excerpt: "Kehricht und Sperrgut\n– Bereitstellung am Sammeltag bis 6.30 Uhr– Bezug Gebührensäcke und Sperrgutmarken\
          \ in lokalen Verkaufsstellen \nund bei der Stadtverwaltung\n– Entsorgung nur in Walliseller Gebührensäcken\
          \ (auch in Containern) \noder mit Sperrgutmarken\n– Keine Entsorgung von Metall, Glas sowie nicht brennbaren\
          \ MaterialienGrüngut– Bereitstellung am Sammeltag bis 6.30 Uhr– Abholung nur in offiziellen Grüngutcontainern\
          \ (140 l, 240 l, 770 l oder 800 l)– Reduktion des Abholungsintervalls im Winter (von Dezember bis Februar\
          \ \n2x monatlich) \n– Entsorgung biogener Abfälle aus Küche und Garten (Schnittgut, \ngemischte Pflanzenreste,\
          \ Gartenabraum (max 1.5 m lang und 20 kg/Stk.), Laub, Christbäume, Rüstabfälle\n– Keine Entsorgung von\
          \ Humus, invasiven Neophyten, Karton, Plastik, \nKunststoff und Katzenstreu\nKarton– Bereitstellung am\
          \ Sammeltag bis 6.30 Uhr– Schachteln und Verpackungen trocken, gefaltet und gebunden– Keine Entsorgung\
          \ von Tetrapack, Styropor oder plastifiziertem Karton, \nsowie verschlossene oder zugeklebte Schachteln\n\
          Papier– Bereitstellung am Sammeltag bis 8.00 Uhr– Gebündelt, nicht in Papiersäcken– Bei Fragen am Sammeltag:\
          \ 079 313 83 04, IG Walliseller VereineHäckseldienst (2x im Jahr)– Anmeldung unter 044 832 62 10 oder\
          \ umwelt@wallisellen.ch– Pauschal 30 CHF pro Anmeldung für 15 Minuten, anschliessend 20 CHF \nfür jede\
          \ weitere 15 Minuten\n– Angenommen werden: Sträucherschnitt, Äste nicht gebunden, \nBaumschnitt (max.\
          \ 10 cm Durchmesser)\n– Keine Entsorgung von Wurzelstöcken und Gartenabraum\nMetallsammlung (2x im Jahr)\n\
          – Mobile Sammelstelle (10.00–13.00 Uhr) im Frühling und Herbst \nbeim Stadthaus\n– Abholservice per Anmeldung\
          \ unter 044 832 62 10 oder \numwelt@wallisellen.ch\n– Maximal 1,0\n×1,5 m und 17 kg/Stk., keine Fremdmaterialien\n\
          – Angenommen werden: Pfannen, Bügelbrett und Drahtgeflechte, Velos, \nNägel usw. \n– Nicht angenommen\
          \ werden: Kühlschränke, Kochherde und \nweitere Elektronikgeräte\nSonderabfallmobil (3x im Jahr)– Angenommen\
          \ werden: Medikamente, Chemikalien, Säuren und Laugen, \nFarben und Lacke usw. \n– Nicht angenommen werden:\
          \ Altöl, Speiseöl, Batterien und Leuchtstoff\x02röhren– Annahmestelle Sonderabfallmobil beim StadthausReparierBar–\
          \ 8304 l Altes Feuerwehrgebäude, Zentralstrasse 4, Wallisellen– Die ReparierBar ist jeweils geöffnet an\
          \ Samstagen von 9.00–12.00 Uhr \n(Daten siehe Kalender)\n– Freiwillige erfahrene Berufsleute begutachten\
          \ und reparieren – wenn \nmöglich mangelhafte Geräte aus den Bereichen: Haushalt, Elektronik, Metall,\
          \ Holz, Textilien, Spielzeug etc.\n– Das Angebot ist kostenlos; Material wird verrechnet– Bitte Ware in\
          \ sauberem Zustand vorbeibringen\nKadaversammelstelle– REMONDIS Recycling AG, Kriesbachstrasse 1, Wallisellen,\
          \ 044 878 10 40\nBring- und Holbörse– Rosenbergstrasse 2, Wallisellen– Öffnungszeiten: Jeden Donnerstag\
          \ 16.00–18.00 Uhr und Samstag \n10.00–12.00 Uhr, geschlossen während den Schulferien und an Feiertagen\n\
          – Kostenloses Bringen und Holen sauberer, funktionsfähiger Gebrauchs\x02gegenstände– Angenommen werden:\
          \ Haushaltgeräte, Gebrauchsgegenstände ohne \nPlastikwaren und Plastikspielzeug, Sportartikel ohne Ski,\
          \ Spielwaren, Küchenutensilien und max. 3 Kleidungsstücke\n– Nicht angenommen werden: verdreckte, uralte\
          \ und abgenutzte Waren– Aufnahmestopp möglichHauptsammelstelle– Mülliland für Abfälle aller Art, REMONDIS\
          \ Recycling AG, Kriesbachstrasse 2, \nWallisellen, 044 878 10 40. Weitere Informationen unter www.remondis\x02\
          recycling.ch\nUntenstehende Wertstoffe werden während den Öffnungszeiten entgegen\x02genommen:– Papier,\
          \ Karton, Glas, Alu und Weissblech, Elektrogeräte, PET-Getränke\x02flaschen, Altmetall, Kaffeekapseln,\
          \ Batterien, Textilien und Schuhe, \nLeuchtmittel, Korken, Speiseöl, Möbel, Kunststoffgebinde, Sportgeräte,\
          \ Teppich, Fässer, EPS (Styropor, Sagex), Holz, Geschirr/Keramik, Ton/Eternit, Steine, Gartenplatten,\
          \ Bauschutt, PC-Polycarbonat (CDs, DVDs), Reifen, Alt- und Motorenöl. Gewisse Fraktionen sind kostenpflichtig\n\
          Weitere Informationen rund ums Thema Entsorgung finden Sie unter www.wallisellen.ch/entsorgung"
