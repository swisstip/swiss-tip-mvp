  - fact_id: waste-set-out-rules-and-fees-3
    statement: According to the Entsorgungskalender 2026, household waste and bulky waste, green waste and cardboard
      must be put out by 6.30 on the collection day and paper by 8.00. Household waste goes only in Wallisellen
      fee bags (also in containers) or with bulky-waste stamps, without metal, glass or non-combustible material.
      Green waste is picked up only in official green-waste containers (140, 240, 770 or 800 litres), twice a month
      from December to February, and excludes soil, invasive neophytes, cardboard, plastic and cat litter. Cardboard
      must be dry, folded and tied, without Tetra Pak, polystyrene, plastic-coated cardboard or closed boxes. Paper
      is bundled, not in paper bags; on collection day questions go to 079 313 83 04, IG Walliseller Vereine.
