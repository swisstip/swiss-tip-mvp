  - fact_id: waste-set-out-rules-and-fees-2
    statement: 'Bulky waste is combustible items too large for a fee bag; non-combustible parts such as metal or
      glass must be removed. Each item may be at most 150 cm long or wide and weigh at most 40 kg, and needs one
      bulky-waste stamp per 5 kg (8 stamps up to 40 kg). A stamp costs CHF 2.10 and a sheet of 10 costs CHF 21.00;
      stamps are sold at the Stadthaus reception, Zentralstrasse 9, through the online counter (at least 5) and
      in grocery shops in Wallisellen (at least 10). Questions: disposal telephone 044 832 62 10.'
