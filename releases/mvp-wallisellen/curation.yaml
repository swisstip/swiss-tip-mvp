  - fact_id: waste-set-out-rules-and-fees-4
    statement: According to the Entsorgungskalender 2026, the Häckseldienst (chipping service, twice a year) needs
      registration at 044 832 62 10 or umwelt@wallisellen.ch and costs a flat CHF 30 per registration for 15 minutes,
      then CHF 20 per further 15 minutes; it takes shrub cuttings, untied branches and tree cuttings up to 10 cm
      in diameter, not root stocks or garden debris. The metal collection (twice a year, spring and autumn, 10.00-13.00
      at the Stadthaus) takes items up to 1.0 x 1.5 m and 17 kg each, such as pans, ironing boards, wire mesh and
      bicycles, but not fridges, cookers or other electronic appliances; a pick-up service is available on registration.
      The Sonderabfallmobil (three times a year, at the Stadthaus) takes medicines, chemicals, acids and alkalis,
      paints and varnishes, but not waste oil, cooking oil, batteries or fluorescent tubes.
