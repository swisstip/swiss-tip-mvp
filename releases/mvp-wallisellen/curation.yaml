        excerpt: "1\nMerkblatt Sperrgutmarken\nTiefbau + Landschaft\nBei Sperrgut handelt es sich um Gegenstände,\
          \ welche \naufgrund Ihrer Grösse nicht in einen gebührenpflichtigen \nKehrichtsack passen. Alle brennbaren\
          \ Materialien (nicht \nbrennbare Teile wie Metall oder Glas zwingend \nentfernen) können mit der genügenden\
          \ Anzahl Sperr\x02gutmarken bestückt mit der Kehrichtsammlung entsorgt \nwerden. Im Gebiet BLAU jeweils\
          \ am Mittwoch und im Ge\x02biet GELB am Donnerstag.\nVerwendung\nVolumen pro Gegenstand / Einheit\n- Maximale\
          \ Länge/Breite: 150 cm\n- Maximales Gewicht pro \nGegenstand/Einheit: 40 kg\nBerechnung zur Verwendung\
          \ von \nSperrgutmarken\n1 Marke bis 5 kg\n2 Marken bis 10 kg\n3 Marken bis 15 kg\n4 Marken bis 20 kg\n\
          5 Marken bis 25 kg\n6 Marken bis 30 kg\n7 Marken bis 35 kg\n8 Marken bis 40 kg\nStanze (Kein Druck)\n\
          Farben:\nProjekt: Gemeinde Wallisellen, Bezeichnung: “Sperrgutmarken/Vorderseite”\n2 Format Bogen: 172\
          \ x 254 mm / Format Etikette: 84 x 49.2 mm\nSchwarz \nAuftrags Nr.: 641007 \nPantone Yellow U\nPreise\n\
          1 Marke CHF 2.10\n1 Bogen à 10 Marken CHF 21.00\nVerkaufsstellen\n- Empfang Stadthaus\nZentralstrasse\
          \ 9 \n8304 Wallisellen\n- www.wallisellen.ch/online-schalter\n(mind. 5 Stk.)\n- diverse Lebensmittelgeschäfte\
          \ in Walli\x02sellen (mind. 10 Stk.)\nHaben Sie Fragen?\n- Entsorgungstelefon Stadt Wallisellen:\n044\
          \ 832 62 10\n- Remondis Recycling AG:\n044 878 10 40"
