        excerpt: "EN To collect your organic waste, you can use compostable bags, but \ndo not use plastic bags!\n\
          FR Pour récolter vos déchets de compost, vous pouvez utiliser des sacs \ncompostables mais pas de sacs\
          \ plastiques!\nIT Per la raccolta dei vostri rifiuti organici potete utilizzare sacchetti \ncompostabili,\
          \ ma non in plastica!\nPT Para recolher os seus resíduos orgânicos, deverá utilizar sacos \ncompostáveis\
          \ e nunca sacos de plástico!\nES Para recoger sus residuos de compost puede utilizar bolsas \ncompostables,\
          \ pero nunca bolsas de plástico¡\nHR Kako biste sakupili svoj organski otpad, možete koristiti \nkompostabilne\
          \ vrec´e, ali nemojte koristiti plasticˇne vrec´e!\nSR Za skupljanje svog organskog otpada, možete da\
          \ koristite \nkompostabilne vrec´e, ali nemojte da koristite plasticˇne vrec´e!\nSQ Për të mledhur mbeturinat\
          \ tuaja organike, ju mund të përdorni \nqese të kompostueshme, por jo qese plastike!\nAR \nSO Marka aad\
