        start: 6558
        end: 7428
        excerpt: 'Hundeabgabe Die Höhe der jährlichen Abgabe beträgt pro Hund und Jahr Fr. 180.00. Der Betrag setzt
          sich wie folgt zusammen: Abgabe Gemeinde Fr. 150.00 + Abgabe Kanton Fr. 30.00 Eine Reduktion auf die Hälfte
          der Kantons- und Gemeindeabgabe wird gewährt, wenn die Hundehaltung erst nach dem 30. Juni angetreten
          wird oder der Hund erst dann das Alter von drei Monaten erreicht. Hundeausbildung Mit Inkraftsetzung der
          revidierten Hundeverordnung per 1. Juni 2025 gilt eine praktische Ausbildungspflicht für alle Hunde, unabhängig
          von ihrer Grösse oder Rasse. Neu müssen Hundehalterinnen und Hundehalter, die noch nie oder seit über
          zehn Jahren keinen Hund mehr gehalten haben, einen Theoriekurs mit abschliessender Prüfung absolvieren.
          Hundeausbildnerinnen und -ausbildner benötigen eine gültige Bewilligung des Veterinäramts Kanton Zürich,
          damit ihre Kurse anerkannt werden.'
      basis:
        level: municipal
        kind: guidance
        refers_to: revidierte Hundeverordnung (per 1. Juni 2025)
