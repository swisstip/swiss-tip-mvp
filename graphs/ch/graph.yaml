- node_id: level.municipal
  kind: level
  label: Communes (municipal level)
  names:
    de: Gemeinden
    en: communes
  summary: The communes (currently around 2,100) are the smallest political units; they carry out tasks delegated
    by the Confederation and the canton, such as the register of residents and civil protection, and have their
    own powers in areas such as schools, social welfare, energy provision, infrastructure, spatial planning and
