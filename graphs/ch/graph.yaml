        heading_path:
        - Federalism
        - Autonomy as a guiding principle
        start: 2767
        end: 3137
        excerpt: The communes, for example, maintain and manage their own infrastructure, including roads and public
          buildings such as schools. The cantons take on higher-level duties including the school system and policing,
          while the Confederation is responsible for national security and foreign policy. Each of the three raises
          its own taxes to help manage the tasks allocated to it.
