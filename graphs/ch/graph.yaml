        start: 825
        end: 1397
        excerpt: For historical reasons, Switzerland is officially known as the Swiss Confederation. The name has
          its origins in the country's founding myth, which tells of the oath taken by its three founding cantons.
          Switzerland has, however, been a federal state since 1848, with the ‹federal city› of Bern as its de facto
          capital. The Confederation shares power with the cantons (constituent states) and the communes. All three
          political levels have a legislature (for law-making) and an executive (for government). Only the Confederation
          and the cantons have judicial powers (courts).
