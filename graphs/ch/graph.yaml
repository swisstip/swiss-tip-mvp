      first_block: 20
      anchor:
        source_url: https://www.aboutswitzerland.eda.admin.ch/en/federalism
        document_id: doc-1594dc773fb922132101
        content_sha256: 7c636ba144a2a15a0f17d22e60730fc88fb9fa93a870e76328ab0440ac95da49
        raw_sha256: e28e910c856ffec7a27be75cfb68855aca1bbadfeadb6a84d43902681b76330c
        block_ids:
        - doc-1594dc773fb922132101:b00020
        block_hashes:
        - 5189a35d598f4c8f24d8c1b9becd63ae35e244070e795dc4d52be32997a696cd
        heading_path:
        - Federalism
        - Autonomy as a guiding principle
        start: 2330
        end: 2765
        excerpt: Within the state structure, power is allocated based on the principle of subsidiarity. Communes,
          which are the smallest political entity, are accorded as much autonomy as possible. This is done so that
          they can carry out as many tasks as possible themselves. Tasks are only delegated to the next level up
          – that is, the cantons – when this makes sense. The same applies when delegating to the highest level,
          which is the Confederation.
