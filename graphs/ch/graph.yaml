        excerpt: Switzerland's political structure consists of the Confederation, 26 cantons and over 2,000 communes.
          Political and legislative powers are distributed across these three levels in a way that grants each of
          them the greatest possible autonomy and brings a diverse range of political stakeholders together under
          one roof. Cantons act as constituent states and have their own constitutions, parliaments, governments
          and courts.
