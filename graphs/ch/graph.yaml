        end: 3158
        excerpt: 'Die kleinste politische Einheit in der Schweiz ist die Gemeinde. Die Gemeinden übernehmen Aufgaben,
          die ihnen vom Bund und ihrem Kanton zugewiesen werden (z. B. Führen der Einwohnerregister oder Zivilschutz).
          In verschiedenen Bereichen haben sie auch eigene Zuständigkeiten, zum Beispiel:'
  - text:
      document_id: doc-104341ee629ab8b0b5e3
      first_block: 42
      anchor:
        source_url: https://www.ch.ch/de/politisches-system/funktionsweise-und-organisation/foderalismus/
        document_id: doc-104341ee629ab8b0b5e3
        content_sha256: f059b6810eb97f21bf683b895a43d4deff978f8adc8f7f61e7033603d0cbc081
        raw_sha256: 3f7da07ab72af035620060340474cd94ff95792832ec489e56589d2e230633a9
        block_ids:
        - doc-104341ee629ab8b0b5e3:b00042
        block_hashes:
        - cc345dcdcb00a5720f8b7b6aa898e46d04e87e944e833de595ddacd8b4be83e4
        heading_path:
        - Der Schweizerische Föderalismus
        - 'Video: Föderalismus'
        start: 1492
        end: 1866
        excerpt: Die Gemeinden handeln eigenständig und entsprechend nach kantonalem Recht und nach Bundesrecht.
          Wenn sie bestimmte Aufgaben nicht mehr eigenständig erfüllen können, übernehmen diese die Kantone. Wenn
          die Kantone nicht mehr eigenständig handeln können, greift der Bund ein. Der Bund übernimmt auch jene
          Aufgaben, die eine einheitliche Regelung auf nationaler Ebene erfordern.
