# Build the container images that hold a pack on one runner, test them, and
# push them to GitHub Container Registry. Started by hand; choose which images:
#
#   all              the Zurich pack, the demo and the calendar image, in that order
#   packs            the Zurich pack
#   mvp-zurich       one pack
#   mvp-wallisellen  one pack, by name only: out of the hackathon scope, and its readiness record (v1, attested
#                    19 September 2026) does not attest the semantic index that swisstip-mcp 0.3.0 requires
#                    to serve hybrid, so its image exits at start until the pack is re-attested
#   demo             the OpenCode demo image, on the Zurich pack image in ghcr.io
#   calendar         the Zurich calendar image: the pack's dataset bundles on the calendar connector image in ghcr.io
#
# The images that hold no release (both MCP images, the embedding sidecar,
# OpenCode) are built, tested and pushed by the workflow of the same name in
# the code repository, swisstip/swiss-tip. This workflow pulls the ones it
# builds on from ghcr.io, so they must have been pushed before, with the
# swisstip-mcp version given here (swisstip_mcp_version), and this repository
# must be able to read their packages: they are public, or each of them names
# this repository under "Manage Actions access" in its package settings. A
# version rehearsed there from TestPyPI is built on the same way, by its tag;
# package_index: testpypi only tells the check client installed here where to
# find that version. As there, the branch the run was started from decides
# two things: the default branch refuses package_index: testpypi, and the
# demo image's latest tag is pushed from the default branch only.
#
# The pack images (docker/<pack>) and the demo image (docker/demo-opencode)
# are defined here, with the packs they carry. The slim image (docker/slim),
# compose.yaml and the check search (docker/mcp/check_semantic.py) are
# the code repository's, which is checked out next to this one at the ref
# given (code_ref).
#
# A pack is two release images: the pack image with Ollama inside, on the
# MCP image, and the slim image without it, on the slim MCP image. The slim
# image is tested as compose.yaml runs it, beside the embedding sidecar of
# ghcr.io.
#
# The demo image is a test image, not part of the product; "all" builds it
# last, on the Zurich pack image of the same run, and "demo" alone builds it
# on the Zurich pack image of ghcr.io. Unlike the release image it also
# carries latest: it is only ever built on mvp-zurich, so latest names one
# pack, and a pull without a tag gets the demo of the current release.
#
# A pack image built earlier in the same run is the demo's base directly, so
# a run without push also works for "all". A selected pack without a
# release.json is skipped with a warning, so a pack that has no release yet
# does not cost the other images their push; every image is pushed only after
# all of them are built and tested.
#
# A pack image is the release image: it is pushed as ghcr.io/<owner>/swiss-tip
# with the tags <release_id>, content-<first 12 hex digits of the release's
# content digest> and <pack>, the moving tag of that pack; the slim image is
# pushed beside it as <release_id>-slim and <pack>-slim. The release image
# carries no latest tag, so a pull of it names a release or a pack. Its
# labels name the release (org.opencontainers.image.version,
# swiss-tip.release.id, swiss-tip.release.content-sha256); the pack, slim and
# demo images carry this repository's commit as
# org.opencontainers.image.revision.
#
# The pack, slim and calendar images are built for linux/amd64 and
# linux/arm64, so an Apple silicon Mac runs them natively; the base images of
# the code repository must have been pushed for both. The runner keeps both
# platforms under one tag in the containerd image store and runs arm64 under
# QEMU: every test above runs on amd64, the build checks (a ready release,
# the hybrid check search, the calendars registered) run on both, and each
# image is started once more on arm64 and must report healthy. Under QEMU
# one embedding takes several seconds, so the pack image's check search
# waits longer there (docker/mvp-zurich/Dockerfile) and its arm64 start is
# given --semantic-timeout 120. docker push then sends both platforms. The
# demo image stays amd64 only: it carries the linux-x64 OpenCode binary.
name: Container images

on:
  workflow_dispatch:
    inputs:
      images:
        description: Images to build
        type: choice
        options: [all, packs, mvp-zurich, mvp-wallisellen, demo, calendar]
        default: all
      swisstip_mcp_version:
        description: swisstip-mcp version (the tag of both MCP images in ghcr.io)
        type: string
        default: 0.3.4
      package_index:
        description: Index the check client is installed from; testpypi rehearses a version that is not released yet
        type: choice
        options: [pypi, testpypi]
        default: pypi
      code_ref:
        description: Branch, tag or commit of swisstip/swiss-tip whose slim Dockerfile and compose.yaml are used
        type: string
        default: main
      push:
        description: Push the tested images to ghcr.io
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      IMAGES: ${{ inputs.images }}
      VERSION: ${{ inputs.swisstip_mcp_version }}
      PACKAGE_INDEX: ${{ inputs.package_index }}
      REF_NAME: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docker/
            /releases/mvp-zurich/release.json
            /releases/mvp-zurich/readiness.json
            /releases/mvp-zurich/semantic-index.json
            /releases/mvp-zurich/README.md
            /releases/mvp-wallisellen/release.json
            /releases/mvp-wallisellen/readiness.json
            /releases/mvp-wallisellen/semantic-index.json
            /datasets/mvp-zurich/*/dataset.json
            /scripts/test/mcp/check_server.py

      # The code repository: the slim Dockerfile, compose.yaml, the check search, and the files the demo
      # image shares with the OpenCode image, which live there and are not copied into this repository.
      - uses: actions/checkout@v7
        with:
          repository: swisstip/swiss-tip
          ref: ${{ inputs.code_ref }}
          path: code
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /compose.yaml
            /docker/slim/
            /docker/mcp/check_semantic.py
            /docker/opencode/
            /scripts/test/connector/check_connector.py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Select images
        run: |
          demo=0; calendar=0
          case "$IMAGES" in
            all)             packs="mvp-zurich"; demo=1; calendar=1 ;;
            packs)           packs="mvp-zurich" ;;
            mvp-zurich|mvp-wallisellen) packs="$IMAGES" ;;
            demo)            packs=""; demo=1 ;;
            calendar)        packs=""; calendar=1 ;;
            *) echo "unknown selection $IMAGES"; exit 1 ;;
          esac
          # The images come from ghcr.io under the version's tag whatever the index; only the check client
          # installed below is a package, and a rehearsed version is on TestPyPI, not on PyPI.
          case "$PACKAGE_INDEX" in
            pypi)     index="" ;;
            testpypi) index="https://test.pypi.org/simple/" ;;
            *) echo "unknown package index $PACKAGE_INDEX"; exit 1 ;;
          esac
          # The default branch builds releases and nothing else, so a rehearsal belongs on another branch.
          if [ -n "$index" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "::error::$DEFAULT_BRANCH builds from PyPI only; run package_index testpypi from another branch"
            exit 1
          fi
          # The demo image's latest tag is what a pull without a tag gets, so it is pushed from the default
          # branch only; the release images carry no latest tag at all.
          latest=0
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then latest=1; fi
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          code_sha=$(git -C code rev-parse HEAD)
          {
            echo "INDEX_URL=$index"
            echo "PUSH_LATEST=$latest"
            echo "BUILD_PACKS=$packs"
            echo "BUILD_DEMO=$demo"
            echo "BUILD_CALENDAR=$calendar"
            echo "REGISTRY=$registry"
            echo "CODE_SHA=$code_sha"
            echo "MCP_IMAGE=$registry/swiss-tip-mcp"
            echo "PACK_IMAGE=$registry/swiss-tip"
            echo "DEMO_IMAGE=$registry/swiss-tip-demo"
            echo "CONNECTOR_IMAGE=$registry/swiss-tip-calendar-connector"
            echo "CALENDAR_IMAGE=$registry/swiss-tip-calendar"
          } >> "$GITHUB_ENV"
          echo "packs=${packs:-none} demo=$demo version=$VERSION registry=$registry code=$code_sha"
          echo "index=$PACKAGE_INDEX ${index:-https://pypi.org/simple/}, branch $REF_NAME of $DEFAULT_BRANCH, demo latest pushed: $latest"

      - name: Install the check client
        run: |
          python -m pip install ${INDEX_URL:+--index-url "$INDEX_URL" --extra-index-url https://pypi.org/simple/} \
            "swisstip-mcp==$VERSION"

      # Both platforms under one tag need the containerd image store; arm64 runs under QEMU.
      - name: Use the containerd image store
        run: |
          python -c "import json, pathlib; p = pathlib.Path('/etc/docker/daemon.json'); c = json.loads(p.read_text()) if p.exists() else {}; c.setdefault('features', {})['containerd-snapshotter'] = True; print(json.dumps(c))" \
            > "$RUNNER_TEMP/daemon.json"
          sudo mv "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{ json .DriverStatus }}' | grep -q containerd.snapshotter \
            || { echo "the Docker daemon does not use the containerd image store"; exit 1; }
          echo "PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test the pack images
        if: env.BUILD_PACKS != ''
        run: |
          port=8100
          for pack in $BUILD_PACKS; do
            release="releases/$pack/release.json"
            # A pack without a release is skipped, so one pack cannot cost the other images their push.
            # A pack that has a release but no readiness record or no index still fails, in the build.
            if [ ! -f "$release" ]; then
              echo "::warning::$pack has no $release; no image built for it"
              echo "$pack" >> "$RUNNER_TEMP/skipped.txt"
              continue
            fi
            release_id=$(python -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['manifest']['release_id'])" "$release")
            digest=$(python -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['manifest']['content_sha256'])" "$release")
            echo "::group::$pack $release_id"
            # The release image: swiss-tip:<release_id>, swiss-tip:content-<digest> and the pack's moving tag swiss-tip:<pack>.
            tags="$PACK_IMAGE:$release_id $PACK_IMAGE:content-${digest:0:12} $PACK_IMAGE:$pack"
            tag_args=""; for tag in $tags; do tag_args="$tag_args -t $tag"; done
            # The build itself fails unless the release is ready and a check search runs hybrid on the bundled model,
            # and, for a pack with datasets, unless every bundle registers with the server through the calendar
            # connector the image carries beside it (the second build context "datasets").
            datasets_args=""
            if ls datasets/"$pack"/*/dataset.json > /dev/null 2>&1; then datasets_args="--build-context datasets=datasets/$pack"; fi
            docker build --platform "$PLATFORMS" -f "docker/$pack/Dockerfile" $datasets_args \
              --build-arg BASE_IMAGE="$MCP_IMAGE:$VERSION" --build-arg PACKAGE_INDEX="$INDEX_URL" \
              --build-arg RELEASE_ID="$release_id" --build-arg RELEASE_CONTENT_SHA256="$digest" \
              --build-arg REVISION="$GITHUB_SHA" \
              $tag_args "releases/$pack"
            port=$((port + 1))
            docker run -d --name "$pack" -p "$port:8000" "$PACK_IMAGE:$release_id"
            for attempt in $(seq 1 120); do curl -fs -o /dev/null "http://127.0.0.1:$port/health" && break; sleep 1; done
            mode=$(curl -fs "http://127.0.0.1:$port/health" | python -c "import json, sys; print(json.load(sys.stdin)['search']['configured_mode'])")
            echo "$pack search mode: $mode"
            if [ "$mode" != hybrid ]; then docker logs "$pack" | tail -40; exit 1; fi
            if [ "$pack" = mvp-zurich ]; then
              python scripts/test/mcp/check_server.py --url "http://127.0.0.1:$port/mcp" --require-lookup
            fi
            docker rm -f "$pack"
            # arm64 under QEMU: the server's warm-up embedding needs more than its 10 seconds there.
            docker run -d --name "$pack-arm64" --platform linux/arm64 -p "$port:8000" "$PACK_IMAGE:$release_id" --semantic-timeout 120
            for attempt in $(seq 1 90); do
              curl -m 5 -fs -o /dev/null "http://127.0.0.1:$port/health" && break
              [ "$(docker inspect --format '{{.State.Running}}' "$pack-arm64")" = true ] || break; sleep 5
            done
            health=$(curl -m 5 -fs "http://127.0.0.1:$port/health" | python -c "import json, sys; h = json.load(sys.stdin); print(h['status'], h['search']['configured_mode'], *[c['status'] for c in h.get('connectors', [])])") \
              || { docker logs "$pack-arm64" | tail -40; exit 1; }
            echo "$pack arm64 ($(docker exec "$pack-arm64" uname -m)): $health"
            case "$health" in "ok hybrid"*) ;; *) docker logs "$pack-arm64" | tail -40; exit 1 ;; esac
            docker rm -f "$pack-arm64"
            echo "$tags" >> "$RUNNER_TEMP/push.txt"
            echo "::endgroup::"

            echo "::group::$pack $release_id slim"
            # The slim release image: the same release on the slim MCP image, without Ollama. Its build fails
            # unless the release is ready and the semantic index was built for exactly this release.
            slim_tags="$PACK_IMAGE:$release_id-slim $PACK_IMAGE:$pack-slim"
            slim_tag_args=""; for tag in $slim_tags; do slim_tag_args="$slim_tag_args -t $tag"; done
            docker build --platform "$PLATFORMS" -f code/docker/slim/Dockerfile \
              --build-arg BASE_IMAGE="$MCP_IMAGE:$VERSION-slim" --build-arg PACK="$pack" \
              --build-arg RELEASE_ID="$release_id" --build-arg RELEASE_CONTENT_SHA256="$digest" \
              --build-arg REVISION="$GITHUB_SHA" \
              $slim_tag_args "releases/$pack"
            # Tested as compose.yaml runs it: beside the embedding sidecar of ghcr.io.
            case "$pack" in
              mvp-zurich) query="Can my wife join me in Switzerland if I have a B permit?" ;;
              *)          query="Where can I dispose of old electronic devices?" ;;
            esac
            export SWISSTIP_REGISTRY="$REGISTRY" SWISSTIP_PACK="$pack" SWISSTIP_PORT="$((port + 50))"
            docker compose -f code/compose.yaml up -d --wait || { docker compose -f code/compose.yaml logs | tail -60; exit 1; }
            mode=$(curl -fs "http://127.0.0.1:$SWISSTIP_PORT/health" | python -c "import json, sys; print(json.load(sys.stdin)['search']['configured_mode'])")
            echo "$pack slim search mode: $mode"
            if [ "$mode" != hybrid ]; then docker compose -f code/compose.yaml logs | tail -40; exit 1; fi
            # From inside the server's container: the sidecar answers on loopback with the index's model digest.
            docker compose -f code/compose.yaml exec -T swiss-tip python - /srv/swiss-tip/release.json /srv/swiss-tip/semantic-index.json "$query" \
              < code/docker/mcp/check_semantic.py
            if [ "$pack" = mvp-zurich ]; then
              python scripts/test/mcp/check_server.py --url "http://127.0.0.1:$SWISSTIP_PORT/mcp" --require-hybrid
            fi
            docker compose -f code/compose.yaml down
            # arm64 under QEMU, on its own: lexical search, the release ready.
            docker run -d --name "$pack-slim-arm64" --platform linux/arm64 -p "$SWISSTIP_PORT:8000" "$PACK_IMAGE:$release_id-slim"
            for attempt in $(seq 1 120); do curl -m 5 -fs -o /dev/null "http://127.0.0.1:$SWISSTIP_PORT/health" && break; sleep 1; done
            status=$(curl -m 5 -fs "http://127.0.0.1:$SWISSTIP_PORT/health" | python -c "import json, sys; print(json.load(sys.stdin)['status'])") \
              || { docker logs "$pack-slim-arm64" | tail -40; exit 1; }
            echo "$pack slim arm64 ($(docker exec "$pack-slim-arm64" uname -m)): $status"
            [ "$status" = ok ] || { docker logs "$pack-slim-arm64" | tail -40; exit 1; }
            docker rm -f "$pack-slim-arm64"
            echo "$slim_tags" >> "$RUNNER_TEMP/push.txt"
            echo "::endgroup::"
          done

      - name: Build and test the demo image
        if: env.BUILD_DEMO == '1'
        run: |
          release="releases/mvp-zurich/release.json"
          if [ ! -f "$release" ]; then
            echo "::warning::mvp-zurich has no $release; no demo image built"
            echo "demo" >> "$RUNNER_TEMP/skipped.txt"
            exit 0
          fi
          release_id=$(python -c "import json, sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['manifest']['release_id'])" "$release")
          echo "::group::demo on $release_id"
          # The base is the pack image of this run, or the one pushed before.
          docker build -f docker/demo-opencode/Dockerfile \
            --build-arg BASE_IMAGE="$PACK_IMAGE:$release_id" \
            --build-context shared=code/docker/opencode \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$DEMO_IMAGE:$release_id" -t "$DEMO_IMAGE:mvp-zurich" -t "$DEMO_IMAGE:latest" docker/demo-opencode
          demo_tags="$DEMO_IMAGE:$release_id $DEMO_IMAGE:mvp-zurich"
          if [ "$PUSH_LATEST" = 1 ]; then demo_tags="$demo_tags $DEMO_IMAGE:latest"; fi
          # The interface is only as good as the routes it reads: one project
          # to open a session in, the knowledge base connected, a model set,
          # the welcome panel with its sample questions. No question is asked
          # here; that would spend a free model's budget and make the run
          # depend on a provider. Then the same with a password: 401 without
          # credentials, and the container healthy although its own check
          # sends none.
          docker run -d --name demo -p 4200:4096 "$DEMO_IMAGE:$release_id"
          for attempt in $(seq 1 120); do curl -fs -o /dev/null http://127.0.0.1:4200/ && break; sleep 1; done
          python code/docker/opencode/check_interface.py --url http://127.0.0.1:4200
          docker rm -f demo
          docker run -d --name demo -p 4200:4096 -e OPENCODE_SERVER_PASSWORD=workflow-check "$DEMO_IMAGE:$release_id"
          for attempt in $(seq 1 120); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' demo)" = healthy ] && break; sleep 1
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' demo)" != healthy ]; then docker logs demo | tail -40; exit 1; fi
          python code/docker/opencode/check_interface.py --url http://127.0.0.1:4200 --password workflow-check
          docker rm -f demo
          echo "$demo_tags" >> "$RUNNER_TEMP/push.txt"
          echo "::endgroup::"

      - name: Build and test the calendar image
        if: env.BUILD_CALENDAR == '1'
        run: |
          # The pack's dataset bundles on the calendar connector image of ghcr.io, tagged with the pack's moving
          # tag, which compose.yaml names behind the profile "calendar", and with the dataset versions. Tested
          # with the conformance test of the connector contract, then registered with the pack's slim image as
          # compose.yaml runs both: every bundle must be bound to its concept.
          versions=$(python -c "import json, glob; print('-'.join(sorted({json.load(open(p, encoding='utf-8'))['manifest']['dataset_version'] for p in glob.glob('datasets/mvp-zurich/*/dataset.json')})))")
          [ -n "$versions" ] || { echo "no dataset bundle under datasets/mvp-zurich"; exit 1; }
          # Every bundle the image carries must end up registered with the server, whatever their number.
          bundles=$(ls -d datasets/mvp-zurich/*/dataset.json | wc -l)
          echo "::group::calendar $versions ($bundles bundles)"
          tags="$CALENDAR_IMAGE:mvp-zurich $CALENDAR_IMAGE:mvp-zurich-$versions"
          tag_args=""; for tag in $tags; do tag_args="$tag_args -t $tag"; done
          docker build --platform "$PLATFORMS" -f docker/mvp-zurich-calendar/Dockerfile \
            --build-arg BASE_IMAGE="$CONNECTOR_IMAGE:$VERSION" \
            --build-arg DATASET_VERSIONS="$versions" --build-arg REVISION="$GITHUB_SHA" \
            $tag_args datasets/mvp-zurich
          for platform in linux/amd64 linux/arm64; do
            docker run -d --name calendar --platform "$platform" -p 8130:8100 "$CALENDAR_IMAGE:mvp-zurich"
            for attempt in $(seq 1 120); do curl -fs -o /dev/null http://127.0.0.1:8130/health && break; sleep 1; done
            echo "$platform: $(docker exec calendar uname -m)"
            python code/scripts/test/connector/check_connector.py --url http://127.0.0.1:8130 || { docker logs calendar | tail -40; exit 1; }
            docker rm -f calendar
          done
          # Beside the server: the slim image of the pack, the sidecar and the connector, as compose.yaml runs them.
          export SWISSTIP_REGISTRY="$REGISTRY" SWISSTIP_PACK=mvp-zurich SWISSTIP_PORT=8180 SWISSTIP_CONNECTORS=http://127.0.0.1:8100
          docker compose -f code/compose.yaml --profile calendar up -d --wait || { docker compose -f code/compose.yaml --profile calendar logs | tail -60; exit 1; }
          registered=$(curl -fs "http://127.0.0.1:$SWISSTIP_PORT/health" | python -c "import json, sys; c = json.load(sys.stdin)['connectors']; print(c[0]['status'], len(c[0]['registered']), len(c[0]['rejected']))")
          echo "server connectors: $registered"
          [ "$registered" = "ok $bundles 0" ] || { docker compose -f code/compose.yaml --profile calendar logs | tail -60; exit 1; }
          docker compose -f code/compose.yaml --profile calendar down
          echo "$tags" >> "$RUNNER_TEMP/push.txt"
          echo "::endgroup::"

      - name: Push the tested images
        if: inputs.push
        run: |
          # From the containerd image store a push sends every platform the tag holds: amd64 and arm64, and amd64
          # alone for the demo image. The registry must then list what the run built.
          for tag in $(cat "$RUNNER_TEMP/push.txt"); do
            docker push "$tag"
            case "$tag" in "$DEMO_IMAGE":*) continue ;; esac
            platforms=$(docker buildx imagetools inspect --format '{{ range .Manifest.Manifests }}{{ .Platform.OS }}/{{ .Platform.Architecture }} {{ end }}' "$tag") \
              || { echo "$tag was pushed as a single-platform image"; exit 1; }
            echo "$tag: $platforms"
            case "$platforms" in *linux/amd64*linux/arm64*|*linux/arm64*linux/amd64*) ;; *) echo "$tag was pushed without both platforms"; exit 1 ;; esac
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Container images"
            echo
            echo "Selection \`$IMAGES\`, swisstip-mcp \`$VERSION\` from \`$PACKAGE_INDEX\`, code \`$CODE_SHA\`, pushed: \`${{ inputs.push }}\`"
            echo
            if [ -f "$RUNNER_TEMP/push.txt" ]; then
              echo "Built and tested:"
              tr ' ' '\n' < "$RUNNER_TEMP/push.txt" | sed 's/^/- `/; s/$/`/'
            else
              echo "No image was built and tested."
            fi
            if [ -f "$RUNNER_TEMP/skipped.txt" ]; then
              echo
              echo "Skipped, no release.json in the pack:"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/skipped.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
